<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas y Supabase (Solo Lectura)</title>
    <!-- Tailwind CSS (CDN Estándar) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS (xlsx) para la exportación a Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        th.sortable { cursor: pointer; user-select: none; }
        th.sortable:hover { background-color: #1e3175 !important; }
        @keyframes flash-success {
            0% { background-color: #bae6fd; }
            100% { background-color: transparent; }
        }
        .saved-flash { animation: flash-success 1s ease-out; }

        .scroll-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 65vh;
        }

        .sync-row {
            height: 55px;
            resize: vertical;
            overflow: hidden;
        }

        th.draggable-th { cursor: grab; position: relative; }
        th.draggable-th:active { cursor: grabbing; }
        th.dragging { opacity: 0.4; background: #1e3175 !important; }
        th.drag-over { border-left: 3px dashed #93c5fd; }

        .resizer {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 40;
        }
        .resizer:hover, .resizing {
            background-color: #93c5fd;
        }

        tr.row-selected,
        tr.row-selected > td,
        tr.row-selected th,
        tr.row-selected .sticky-sticky-bg {
            background-color: #D5F0AF !important;
            --tw-bg-opacity: 1 !important;
            color: #1e293b !important;
        }

        #data-table th {
            position: sticky;
            top: 0;
            z-index: 30;
        }

        /* MODIFICACIÓN: Se ajustaron los offsets porque se eliminó la columna de edición (lápiz) */
        .sticky-col-0    { position: sticky; left: 0px; z-index: 35; width: 70px; min-width: 70px; max-width: 90px; }
        .sticky-col-1    { position: sticky; left: 70px; z-index: 35; width: 240px; min-width: 100px; box-shadow: 2px 0 5px -2px rgba(0,0,0,0.1); }
        
        html:not(.dark) tr.bg-white .sticky-sticky-bg { background-color: #ffffff; }
        html:not(.dark) tr.bg-slate-100\/70 .sticky-sticky-bg { background-color: #f1f5f9; }
        html:not(.dark) tr.row-vencida .sticky-sticky-bg { background-color: #fee2e2 !important; }
        html:not(.dark) tr.row-tardia .sticky-sticky-bg { background-color: #ffedd5 !important; }

        html.dark tr.bg-slate-900 .sticky-sticky-bg { background-color: #0f172a; }
        html.dark tr.bg-slate-800\/50 .sticky-sticky-bg { background-color: #1e293b; }
        html.dark tr.row-vencida .sticky-sticky-bg { background-color: #7f1d1d !important; }
        html.dark tr.row-tardia .sticky-sticky-bg { background-color: #7c2d12 !important; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans min-h-screen flex flex-col transition-colors duration-200">

    <header class="bg-[#2A409C] dark:bg-slate-900 dark:border-b dark:border-slate-800 text-white shadow-md">
        <div class="w-full px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            
            <div class="flex flex-wrap items-center gap-4 w-full md:w-auto justify-between md:justify-start">
                <h1 class="text-xl font-bold tracking-tight">Gestor de Tareas</h1>
                <div class="flex items-center gap-2">
                    <button onclick="goHome()" class="bg-[#1e3175] hover:bg-[#162554] dark:bg-slate-800 dark:hover:bg-slate-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer shadow-xs border border-blue-800 dark:border-slate-700">
                        <i class="fa-solid fa-house"></i> Inicio
                    </button>
                    <button id="btn-refresh" onclick="loadTableData()" class="bg-[#1e3175] hover:bg-[#162554] dark:bg-slate-800 dark:hover:bg-slate-700 text-white px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer shadow-xs border border-blue-800 dark:border-slate-700">
                        <i class="fa-solid fa-rotate"></i> Actualizar
                    </button>
                    
                    <!-- MODIFICACIÓN: Botón Nueva Tarea Deshabilitado -->
                    <button id="btn-new" disabled class="bg-slate-400 dark:bg-slate-700 text-slate-200 dark:text-slate-500 px-3.5 py-2 rounded-lg text-xs font-semibold flex items-center gap-1.5 cursor-not-allowed shadow-none" title="Creación de tareas deshabilitada">
                        <i class="fa-solid fa-plus"></i> Nueva Tarea
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-3 w-full md:w-auto justify-end">
                <button onclick="toggleDarkMode()" class="bg-[#1e3175] hover:bg-[#162554] dark:bg-slate-800 dark:hover:bg-slate-700 text-blue-100 border border-blue-700 dark:border-slate-700 px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 cursor-pointer shadow-xs" title="Cambiar modo claro / oscuro">
                    <i id="theme-icon" class="fa-solid fa-moon text-blue-300"></i> <span id="theme-text" class="hidden sm:inline">Modo Oscuro</span>
                </button>

                <button onclick="exportToExcel()" class="bg-[#1e3175] hover:bg-[#162554] dark:bg-slate-800 dark:hover:bg-slate-700 text-blue-100 border border-blue-700 dark:border-slate-700 px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 cursor-pointer shadow-xs" title="Exportar datos actuales a XLSX">
                    <i class="fa-solid fa-file-excel text-blue-300"></i> Exportar XLSX
                </button>

                <button onclick="toggleTablesPanel()" class="bg-[#1e3175] hover:bg-[#162554] dark:bg-slate-800 dark:hover:bg-slate-700 text-blue-100 border border-blue-700 dark:border-slate-700 px-3.5 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-2 cursor-pointer shadow-xs">
                    <i class="fa-solid fa-table-cells"></i> <span id="toggle-btn-text">Ver tablas auxiliares</span>
                </button>
                <div class="flex items-center gap-2 text-xs bg-[#192b66] dark:bg-slate-800 text-blue-200 dark:text-slate-300 px-3.5 py-2 rounded-full border border-blue-800 dark:border-slate-700">
                    <span class="w-2 h-2 rounded-full bg-blue-400 animate-pulse"></span>
                    <span>Conectado (Solo Lectura)</span>
                </div>
            </div>
        </div>
    </header>

    <div id="aux-tables-panel" class="hidden bg-slate-100 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 px-6 py-4 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex flex-col gap-3">
            <div class="flex justify-between items-center">
                <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 dark:text-slate-400"><i class="fa-solid fa-database mr-1"></i> Tablas auxiliares del sistema (Solo Lectura)</h3>
                <button onclick="toggleTablesPanel()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-xs cursor-pointer"><i class="fa-solid fa-xmark"></i> Cerrar</button>
            </div>
            <div id="tables-list" class="flex flex-wrap gap-2"></div>
        </div>
    </div>

    <main class="w-full px-6 py-6 flex-1 flex flex-col gap-6">
        <section class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 p-6 flex flex-col gap-6 flex-1 overflow-hidden transition-colors">
            
            <div id="wrapper-filters" class="flex flex-col gap-2">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3">
                    <button onclick="toggleFiltersPanel()" class="text-xs font-semibold text-[#2A409C] dark:text-blue-400 hover:text-[#1e3175] flex items-center gap-1.5 cursor-pointer">
                        <i id="filter-toggle-icon" class="fa-solid fa-chevron-down text-[10px]"></i> 
                        <span id="filter-toggle-text">Ocultar filtros de búsqueda</span>
                    </button>

                    <div class="flex items-center gap-2 w-full md:w-auto">
                        <div class="relative flex-1 md:w-64">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-2.5 text-slate-400 pointer-events-none">
                                <i class="fa-solid fa-magnifying-glass text-xs"></i>
                            </span>
                            <input type="text" id="input-buscar-nombre" oninput="applyFilters()" placeholder="Buscar por nombre..." class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg pl-8 pr-3 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0] focus:bg-white dark:focus:bg-slate-900 transition">
                        </div>
                        <button onclick="applyFilters()" class="bg-[#0083B0] hover:bg-[#006e94] text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 cursor-pointer shadow-xs shrink-0">
                            Buscar
                        </button>
                    </div>

                    <div class="flex items-center gap-4">
                        <label class="flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                            <input type="checkbox" id="check-mostrar-archivadas" onchange="applyFilters()" class="rounded border-slate-300 dark:border-slate-700 text-[#0083B0] focus:ring-[#0083B0] w-4 h-4 cursor-pointer bg-transparent">
                            Mostrar Archivadas
                        </label>
                        <label class="flex items-center gap-2 text-xs font-medium text-slate-600 dark:text-slate-300 cursor-pointer select-none">
                            <input type="checkbox" id="check-top-scrollbar" onchange="toggleTopScrollbar(this)" class="rounded border-slate-300 dark:border-slate-700 text-[#0083B0] focus:ring-[#0083B0] w-4 h-4 cursor-pointer bg-transparent">
                            Scroll Bar Superior
                        </label>
                    </div>
                </div>

                <div id="filters-container" class="bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 p-4 rounded-xl flex flex-wrap items-end gap-3 transition-all duration-300">
                    <div class="flex flex-col gap-1 flex-1 min-w-[140px]">
                        <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Estado</label>
                        <select id="filter-estado" onchange="applyFilters()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0]">
                            <option value="">Todos los estados</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1 flex-1 min-w-[140px]">
                        <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Usuario</label>
                        <select id="filter-usuario" onchange="applyFilters()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0]">
                            <option value="">Todos los usuarios</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1 flex-1 min-w-[140px]">
                        <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Cumplimiento</label>
                        <select id="filter-cumplimiento" onchange="applyFilters()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0]">
                            <option value="">Todos</option>
                            <option value="en_curso">En Curso</option>
                            <option value="agendadas">Agendadas</option>
                            <option value="atrasadas">Atrasadas</option>
                            <option value="vencidas">Vencidas</option>
                            <option value="tardia">Entrega Tardía</option>
                        </select>
                    </div>

                    <div class="flex flex-col gap-1 flex-1 min-w-[140px]">
                        <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Fecha Asignada</label>
                        <input type="date" id="filter-f-asignada" onchange="applyFilters()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0]">
                    </div>

                    <div class="flex flex-col gap-1 flex-1 min-w-[140px]">
                        <label class="text-[11px] font-medium text-slate-600 dark:text-slate-400">Fecha Vencimiento</label>
                        <input type="date" id="filter-f-vencimiento" onchange="applyFilters()" class="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-700 dark:text-slate-200 focus:outline-none focus:border-[#0083B0]">
                    </div>

                    <div class="flex items-end">
                        <button onclick="clearFilters()" class="bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1 cursor-pointer h-[30px]" title="Limpiar filtros">
                            <i class="fa-solid fa-filter-circle-xmark"></i> Limpiar
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col flex-1 border border-slate-100 dark:border-slate-700 rounded-lg overflow-hidden">
                <div id="top-scrollbar" class="overflow-x-auto bg-slate-100 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-700 hidden" onscroll="syncScroll('top')">
                    <div id="top-scrollbar-content" class="h-2"></div>
                </div>

                <div id="bottom-scrollbar" class="scroll-container bg-white dark:bg-slate-900" onscroll="syncScroll('bottom')">
                    <table id="data-table" class="w-full text-left border-collapse min-w-[1100px]" style="table-layout: fixed;">
                        <thead id="table-head" class="text-xs uppercase font-semibold border-b border-slate-800 dark:border-slate-700">
                            <tr>
                                <th class="p-3 text-center" style="background-color: #2A409C; color: #ffffff;">Cargando datos...</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 dark:divide-slate-800 text-xs text-slate-700 dark:text-slate-200">
                            <tr>
                                <td class="p-8 text-center text-slate-400 italic">Cargando registros de Supabase...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <p id="table-instructions" class="text-[11px] text-slate-400 italic text-right"><i class="fa-solid fa-lock mr-1"></i> Esta es una vista de solo lectura.</p>
        </section>
    </main>

    <!-- Modal para Crear/Editar (se mantiene estructuralmente pero es inaccesible) -->
    <div id="record-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs hidden items-center justify-center p-4 z-50">
        <!-- Contenido oculto -->
    </div>

    <!-- Script de Lógica -->
    <script>
        const SUPABASE_URL = "https://pefmjjtmnhawtqjwmkme.supabase.co";
        const SUPABASE_KEY = "sb_publishable_ptwqt2I3mu9WTfB2Zz6hOg__WoACVSE";

        const defaultTareasOrder = [
            'orden', 'nombre', 'id_usuario', 'id_estado', 'fecha_asignada', 
            'fecha_vencimiento', 'fecha_entregada', 'id_evaluacion', 
            'id_motivo', 'porcentaje_avance', 'observaciones', 
            'id_situacion', 'id_predecesor', 
            'fecha_creada', 'id_actividad', 'id_etapa'
        ];

        const dbSchema = {
            tareas: ['id', ...defaultTareasOrder],
            actividad: ['id', 'id_etapa', 'nombre', 'color'],
            estados: ['id', 'nombre', 'color'],
            etapas: ['id', 'nombre', 'color'],
            evaluaciones: ['id', 'nombre', 'color'],
            jerarquia: ['id', 'nombre', 'color'],
            motivos: ['id', 'nombre', 'color'],
            situaciones: ['id', 'nombre', 'color'],
            usuarios: ['id', 'nombre', 'celular', 'email', 'color']
        };

        const foreignKeyTables = {
            'id_etapa': 'etapas',
            'id_jerarquia': 'jerarquia',
            'id_estado': 'estados',
            'id_situacion': 'situaciones',
            'id_usuario': 'usuarios',
            'id_evaluacion': 'evaluaciones',
            'id_actividad': 'actividad',
            'id_motivo': 'motivos'
        };

        let supabaseClient = null;
        let currentTable = 'tareas';
        let currentTableData = [];
        let filteredTableData = [];
        let cacheForeignData = {};
        let sortColumn = null;
        let sortDirection = 'asc';
        let globalRowHeight = 55; 

        let customColumnOrders = {
            tareas: [...defaultTareasOrder]
        };

        let draggedColumnIndex = null;

        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            try {
                supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                renderAuxTablesList();
                populateFilterDropdowns();
                selectTable('tareas');
            } catch (err) {
                alert('Error al inicializar la conexión con Supabase: ' + err.message);
            }
        });

        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                updateThemeUI(true);
            } else {
                document.documentElement.classList.remove('dark');
                updateThemeUI(false);
            }
        }

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateThemeUI(isDark);
        }

        function updateThemeUI(isDark) {
            const icon = document.getElementById('theme-icon');
            const text = document.getElementById('theme-text');
            if (isDark) {
                icon.className = 'fa-solid fa-sun text-yellow-300';
                if (text) text.innerText = 'Modo Claro';
            } else {
                icon.className = 'fa-solid fa-moon text-blue-300';
                if (text) text.innerText = 'Modo Oscuro';
            }
        }

        function goHome() {
            selectTable('tareas');
            clearFilters();
        }

        function syncScroll(source) {
            const topBar = document.getElementById('top-scrollbar');
            const bottomBar = document.getElementById('bottom-scrollbar');
            if (source === 'top') {
                bottomBar.scrollLeft = topBar.scrollLeft;
            } else {
                topBar.scrollLeft = bottomBar.scrollLeft;
            }
        }

        function updateScrollbarsWidth() {
            const table = document.getElementById('data-table');
            const topContent = document.getElementById('top-scrollbar-content');
            if (table && topContent) {
                topContent.style.width = table.scrollWidth + 'px';
            }
        }

        function toggleTopScrollbar(checkbox) {
            const topBar = document.getElementById('top-scrollbar');
            if (checkbox.checked) {
                topBar.classList.remove('hidden');
                updateScrollbarsWidth();
            } else {
                topBar.classList.add('hidden');
            }
        }

        function toggleFiltersPanel() {
            const container = document.getElementById('filters-container');
            const icon = document.getElementById('filter-toggle-icon');
            const text = document.getElementById('filter-toggle-text');
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                container.classList.add('flex');
                icon.className = 'fa-solid fa-chevron-down text-[10px]';
                text.innerText = 'Ocultar filtros de búsqueda';
            } else {
                container.classList.remove('flex');
                container.classList.add('hidden');
                icon.className = 'fa-solid fa-chevron-right text-[10px]';
                text.innerText = 'Mostrar filtros de búsqueda';
            }
        }

        async function populateFilterDropdowns() {
            try {
                await loadCatalogIntoSelect('estados', 'filter-estado');
                await loadCatalogIntoSelect('usuarios', 'filter-usuario');
            } catch (e) {
                console.error("Error al poblar filtros:", e);
            }
        }

        async function loadCatalogIntoSelect(tableName, selectId) {
            const select = document.getElementById(selectId);
            if (!cacheForeignData[tableName]) {
                const { data, error } = await supabaseClient.from(tableName).select('id, nombre, color');
                if (!error) {
                    cacheForeignData[tableName] = data || [];
                }
            }
            const records = cacheForeignData[tableName] || [];
            records.forEach(rec => {
                const opt = document.createElement('option');
                opt.value = rec.id;
                opt.innerText = rec.nombre;
                select.appendChild(opt);
            });
        }

        function toggleTablesPanel() {
            const panel = document.getElementById('aux-tables-panel');
            const btnText = document.getElementById('toggle-btn-text');
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                btnText.innerText = 'Ocultar tablas auxiliares';
            } else {
                panel.classList.add('hidden');
                btnText.innerText = 'Ver tablas auxiliares';
            }
        }

        function renderAuxTablesList() {
            const listContainer = document.getElementById('tables-list');
            listContainer.innerHTML = '';

            Object.keys(dbSchema).forEach(tableName => {
                if (tableName === 'tareas') return;

                const btn = document.createElement('button');
                btn.className = `px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-2 cursor-pointer ${currentTable === tableName ? 'bg-[#2A409C] text-white font-semibold shadow-sm' : 'bg-white dark:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-600 hover:bg-slate-50 dark:hover:bg-slate-600'}`;
                btn.innerHTML = `<i class="fa-solid fa-table"></i> ${tableName}`;
                btn.onclick = () => {
                    selectTable(tableName);
                    toggleTablesPanel();
                };
                listContainer.appendChild(btn);
            });
        }

        async function selectTable(tableName) {
            currentTable = tableName;
            sortColumn = null;
            sortDirection = 'asc';
            
            if (currentTable === 'tareas') {
                sortColumn = 'orden';
                sortDirection = 'asc';
            }

            renderAuxTablesList();
            
            if (!customColumnOrders[currentTable]) {
                customColumnOrders[currentTable] = [...(dbSchema[currentTable] || [])].filter(c => c !== 'id');
            }

            const wrapperFilters = document.getElementById('wrapper-filters');
            const btnNew = document.getElementById('btn-new');
            const instructions = document.getElementById('table-instructions');

            if (tableName === 'tareas') {
                wrapperFilters.classList.remove('hidden');
                wrapperFilters.classList.add('flex');
                btnNew.style.display = 'inline-flex';
                instructions.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> Esta es una vista de solo lectura.';
            } else {
                wrapperFilters.classList.remove('flex');
                wrapperFilters.classList.add('hidden');
                btnNew.style.display = 'none';
                instructions.innerHTML = '<i class="fa-solid fa-lock mr-1"></i> Esta es una tabla auxiliar de solo lectura.';
            }

            await loadTableData();
        }

        async function loadTableData() {
            if (!supabaseClient || !currentTable) return;

            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '<tr><td colspan="100" class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Cargando registros...</td></tr>';

            try {
                let query = supabaseClient.from(currentTable).select('*');

                if (currentTable === 'tareas') {
                    query = supabaseClient.from('tareas').select(`
                        id, orden, nombre, observaciones, porcentaje_avance,
                        fecha_creada, fecha_asignada, fecha_vencimiento, fecha_entregada, id_predecesor,
                        id_etapa, id_estado, id_situacion, id_usuario, id_evaluacion, id_actividad, id_motivo,
                        etapas:id_etapa(nombre, color),
                        estados:id_estado(nombre, color),
                        situaciones:id_situacion(nombre, color),
                        usuarios:id_usuario(nombre, color),
                        evaluaciones:id_evaluacion(nombre, color),
                        actividad:id_actividad(nombre, color),
                        motivos:id_motivo(nombre, color)
                    `);
                }

                const { data, error } = await query.limit(100);
                if (error) throw error;
                currentTableData = data || [];
                filteredTableData = [...currentTableData];

                if (currentTable === 'tareas') {
                    if (!sortColumn) {
                        sortColumn = 'orden';
                        sortDirection = 'asc';
                    }
                    applyFilters();
                } else {
                    renderTableContent();
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="100" class="p-6 text-center text-rose-500 bg-rose-50 dark:bg-rose-950/50 rounded">Error al cargar datos: ${err.message}</td></tr>`;
            }
        }

        function applyFilters() {
            if (currentTable !== 'tareas') return;

            const estadoVal = document.getElementById('filter-estado').value;
            const usuarioVal = document.getElementById('filter-usuario').value;
            const cumplimientoVal = document.getElementById('filter-cumplimiento').value;
            const fAsignadaVal = document.getElementById('filter-f-asignada').value;
            const fVencimientoVal = document.getElementById('filter-f-vencimiento').value;
            const mostrarArchivadas = document.getElementById('check-mostrar-archivadas').checked;
            const textBuscar = document.getElementById('input-buscar-nombre').value.toLowerCase().trim();

            const todayStr = new Date().toISOString().split('T')[0];

            filteredTableData = currentTableData.filter(row => {
                if (!mostrarArchivadas && Number(row.id_estado) === 7) return false;
                if (estadoVal && String(row.id_estado) !== estadoVal) return false;
                if (usuarioVal && String(row.id_usuario) !== usuarioVal) return false;
                if (fAsignadaVal && (!row.fecha_asignada || row.fecha_asignada !== fAsignadaVal)) return false;
                if (fVencimientoVal && (!row.fecha_vencimiento || row.fecha_vencimiento !== fVencimientoVal)) return false;
                
                if (textBuscar) {
                    const nombreRow = row.nombre ? String(row.nombre).toLowerCase() : '';
                    if (!nombreRow.includes(textBuscar)) return false;
                }

                if (cumplimientoVal) {
                    const fAsig = row.fecha_asignada;
                    const fVenc = row.fecha_vencimiento;
                    const fEnt = row.fecha_entregada;

                    if (cumplimientoVal === 'en_curso') {
                        if (!fAsig || !fVenc || !(todayStr >= fAsig && todayStr <= fVenc)) return false;
                    } else if (cumplimientoVal === 'agendadas') {
                        if (!fAsig || fAsig <= todayStr) return false;
                    } else if (cumplimientoVal === 'atrasadas') {
                        if (fEnt || !fVenc || fVenc >= todayStr) return false;
                    } else if (cumplimientoVal === 'vencidas') {
                        if (!fVenc || fVenc >= todayStr) return false;
                    } else if (cumplimientoVal === 'tardia') {
                        if (!fEnt || !fVenc || fEnt <= fVenc) return false;
                    }
                }

                return true;
            });

            sortAndRender();
        }

        function clearFilters() {
            document.getElementById('filter-estado').value = '';
            document.getElementById('filter-usuario').value = '';
            document.getElementById('filter-cumplimiento').value = '';
            document.getElementById('filter-f-asignada').value = '';
            document.getElementById('filter-f-vencimiento').value = '';
            document.getElementById('check-mostrar-archivadas').checked = false;
            document.getElementById('input-buscar-nombre').value = '';
            applyFilters();
        }

        function sortTable(column) {
            if (sortColumn === column) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = column;
                sortDirection = 'asc';
            }
            sortAndRender();
        }

        function sortAndRender() {
            if (sortColumn) {
                filteredTableData.sort((a, b) => {
                    let valA = a[sortColumn];
                    let valB = b[sortColumn];

                    if (foreignKeyTables[sortColumn]) {
                        const rel = foreignKeyTables[sortColumn];
                        valA = a[rel]?.nombre || '';
                        valB = b[rel]?.nombre || '';
                    }

                    if (valA === null || valA === undefined) valA = '';
                    if (valB === null || valB === undefined) valB = '';

                    if (sortColumn === 'id' || sortColumn === 'orden') {
                        valA = Number(valA) || 0;
                        valB = Number(valB) || 0;
                    } else if (typeof valA === 'string') {
                        valA = valA.toLowerCase();
                        valB = valB.toLowerCase();
                    }

                    if (valA < valB) return sortDirection === 'asc' ? -1 : 1;
                    if (valA > valB) return sortDirection === 'asc' ? 1 : -1;
                    return 0;
                });
            }
            renderTableContent();
        }

        function handleRowClick(trElement) {
            document.querySelectorAll('#data-table tbody tr').forEach(tr => {
                tr.classList.remove('row-selected');
            });
            trElement.classList.add('row-selected');
        }

        function handleDragStart(e, index) {
            draggedColumnIndex = index;
            e.target.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }

        function handleDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }

        function handleDragEnter(e, index) {
            e.preventDefault();
            const th = e.target.closest('th');
            if (th && index !== draggedColumnIndex) th.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            const th = e.target.closest('th');
            if (th) th.classList.remove('drag-over');
        }

        function handleDrop(e, targetIndex) {
            e.preventDefault();
            const th = e.target.closest('th');
            if (th) th.classList.remove('drag-over');

            if (draggedColumnIndex === null || draggedColumnIndex === targetIndex) return;

            const columns = customColumnOrders[currentTable];
            const movedColumn = columns.splice(draggedColumnIndex, 1)[0];
            columns.splice(targetIndex, 0, movedColumn);

            draggedColumnIndex = null;
            renderTableContent();
        }

        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('th').forEach(el => el.classList.remove('drag-over'));
            draggedColumnIndex = null;
        }

        function makeResizable(th) {
            const resizer = document.createElement('div');
            resizer.className = 'resizer';
            th.appendChild(resizer);

            let startX, startWidth;

            resizer.addEventListener('mousedown', function(e) {
                e.stopPropagation();
                startX = e.pageX;
                startWidth = th.offsetWidth;
                resizer.classList.add('resizing');

                function onMouseMove(e) {
                    const diff = e.pageX - startX;
                    const newWidth = Math.max(50, startWidth + diff);
                    th.style.width = newWidth + 'px';
                    th.style.minWidth = newWidth + 'px';
                    th.style.maxWidth = newWidth + 'px';

                    if (currentTable === 'tareas') {
                        updateStickyPositions();
                    }
                }

                function onMouseUp() {
                    resizer.classList.remove('resizing');
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    updateScrollbarsWidth();
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        // MODIFICACIÓN: Ajustado para la eliminación de la columna del lápiz
        function updateStickyPositions() {
            const th0 = document.querySelector('.sticky-col-0');
            const th1 = document.querySelector('.sticky-col-1');

            let left0 = 0;
            let left1 = left0 + (th0 ? th0.offsetWidth : 70);

            if (th0) th0.style.left = left0 + 'px';
            if (th1) th1.style.left = left1 + 'px';

            document.querySelectorAll('#data-table tbody tr').forEach(tr => {
                const td0 = tr.querySelector('.sticky-col-0');
                const td1 = tr.querySelector('.sticky-col-1');

                if (td0) td0.style.left = left0 + 'px';
                if (td1) td1.style.left = left1 + 'px';
            });
        }

        function renderTableContent() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const columns = customColumnOrders[currentTable] || dbSchema[currentTable] || [];
            const dataset = currentTable === 'tareas' ? filteredTableData : currentTableData;
            
            // MODIFICACIÓN PRINCIPAL: Forzar a TRUE para todo el sistema para evitar edición inline (dblclick)
            const isReadonly = true; 

            let headHtml = '<tr>';
            
            if (currentTable === 'tareas') {
                // MODIFICACIÓN: Se eliminó la columna del lápiz
                headHtml += `<th class="p-3 font-semibold capitalize sortable sticky-col-0" style="background-color: #2A409C; color: #ffffff; z-index: 40;" onclick="sortTable('orden')">ord${sortColumn === 'orden' ? (sortDirection === 'asc' ? ' <i class="fa-solid fa-arrow-up text-[10px]"></i>' : ' <i class="fa-solid fa-arrow-down text-[10px]"></i>') : ''}</th>`;
                headHtml += `<th class="p-3 font-semibold capitalize sortable sticky-col-1" style="background-color: #2A409C; color: #ffffff; z-index: 40;" onclick="sortTable('nombre')">Nombre</th>`;
            }

            columns.forEach((col, index) => {
                if (currentTable === 'tareas' && (col === 'id' || col === 'orden' || col === 'nombre')) return;
                if (col === 'color' && currentTable !== 'tareas') return;
                if (currentTable === 'tareas' && (col === 'jerarquia' || col === 'apertura')) return;
                
                let colTitle = col;
                if (currentTable === 'tareas' && foreignKeyTables[col]) {
                    colTitle = foreignKeyTables[col];
                }
                const isWide = ['fecha_asignada', 'fecha_vencimiento', 'fecha_entregada', 'id_evaluacion', 'id_motivo'].includes(col);
                const widthStyle = isWide ? 'width: 140px; min-width: 140px;' : 'width: 120px; min-width: 100px;';
                const sortIcon = sortColumn === col ? (sortDirection === 'asc' ? ' <i class="fa-solid fa-arrow-up text-[10px]"></i>' : ' <i class="fa-solid fa-arrow-down text-[10px]"></i>') : '';
                
                headHtml += `<th draggable="true" 
                                ondragstart="handleDragStart(event, ${index})" 
                                ondragover="handleDragOver(event)" 
                                ondragenter="handleDragEnter(event, ${index})" 
                                ondragleave="handleDragLeave(event)" 
                                ondrop="handleDrop(event, ${index})" 
                                ondragend="handleDragEnd(event)" 
                                class="p-3 font-semibold capitalize sortable draggable-th" 
                                style="background-color: #2A409C; color: #ffffff; ${widthStyle}" 
                                title="Arrastra para mover de posición"
                                onclick="if(event.target.tagName !== 'I' && !event.target.classList.contains('resizer')) sortTable('${col}')">${colTitle.replace('_', ' ')}${sortIcon}</th>`;
            });
            
            headHtml += '</tr>';
            thead.innerHTML = headHtml;

            thead.querySelectorAll('th').forEach(th => makeResizable(th));

            if (dataset.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${columns.length + 2}" class="p-8 text-center text-slate-400 italic">No se encontraron registros.</td></tr>`;
                updateScrollbarsWidth();
                return;
            }

            const todayStr = new Date().toISOString().split('T')[0];

            let bodyHtml = '';
            dataset.forEach((row, rowIndex) => {
                const recordId = row.id;

                const fVenc = row.fecha_vencimiento;
                const fEnt = row.fecha_entregada;
                let rowColorClass = rowIndex % 2 === 0 ? 'bg-white dark:bg-slate-900' : 'bg-slate-100/70 dark:bg-slate-800/50';

                if (currentTable === 'tareas') {
                    const isVencidaSinEntrega = fVenc && fVenc < todayStr && !fEnt;
                    const isEntregaTardia = fEnt && fVenc && fEnt > fVenc;

                    if (isVencidaSinEntrega) {
                        rowColorClass = 'row-vencida bg-red-100 dark:bg-red-950/40';
                    } else if (isEntregaTardia) {
                        rowColorClass = 'row-tardia bg-orange-100 dark:bg-amber-950/40';
                    }
                }

                bodyHtml += `<tr id="row-${recordId}" class="sync-row ${rowColorClass} hover:opacity-90 transition" style="height: ${globalRowHeight}px;" onmouseup="syncAllRowHeights(this)">`;
                
                if (currentTable === 'tareas') {
                    // MODIFICACIÓN: Se eliminó la celda TD que contenía el botón con el lápiz de edición
                    const ordenVal = row['orden'] !== null && row['orden'] !== undefined ? row['orden'] : '';
                    bodyHtml += `<td class="p-2 sticky-col-0 sticky-sticky-bg text-center text-[11px] font-medium h-full align-middle cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                        ${ordenVal !== '' ? ordenVal : '<span class="text-slate-300 dark:text-slate-600 italic">-</span>'}
                    </td>`;

                    const nVal = row['nombre'] !== null && row['nombre'] !== undefined ? row['nombre'] : '';
                    bodyHtml += `<td class="p-2 sticky-col-1 sticky-sticky-bg font-medium h-full align-middle truncate cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                        ${nVal !== '' ? nVal : '<span class="text-slate-300 dark:text-slate-600 italic">Vacío</span>'}
                    </td>`;
                }

                columns.forEach(col => {
                    if (currentTable === 'tareas' && (col === 'id' || col === 'orden' || col === 'nombre')) return;
                    if (col === 'color' && currentTable !== 'tareas') return;
                    if (currentTable === 'tareas' && (col === 'jerarquia' || col === 'apertura')) return;

                    let val = row[col];

                    if (currentTable === 'tareas' && foreignKeyTables[col]) {
                        const relTable = foreignKeyTables[col];
                        const relName = row[relTable] && row[relTable].nombre ? row[relTable].nombre : 'Sin asignar';
                        const relColor = row[relTable] && row[relTable].color ? row[relTable].color : '#64748b';
                        
                        bodyHtml += `<td class="p-2 h-full align-middle cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                            <span class="w-full block text-center px-2 py-1 rounded text-[11px] font-medium text-white shadow-xs cursor-pointer" style="background-color: ${relColor};">${relName}</span>
                        </td>`;
                    } else if (col.includes('fecha')) {
                        const dateVal = val || '';
                        bodyHtml += `<td class="p-2 h-full align-middle text-[11px] cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                            ${dateVal ? dateVal : '<span class="text-slate-300 dark:text-slate-600 italic">Fecha</span>'}
                        </td>`;
                    } else if (col === 'color' && currentTable !== 'tareas') {
                        bodyHtml += `<td class="p-2 h-full align-middle cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                            <span class="w-full block text-center px-2 py-1 rounded text-[11px] font-semibold text-white" style="background-color: ${val};">${val}</span>
                        </td>`;
                    } else {
                        const displayVal = (val !== null && val !== undefined) ? val : '';
                        bodyHtml += `<td class="p-2 truncate h-full align-middle cursor-pointer" onclick="handleRowClick(this.closest('tr'))">
                            ${displayVal !== '' ? displayVal : '<span class="text-slate-300 dark:text-slate-600 italic">Vacío</span>'}
                        </td>`;
                    }
                });
                
                bodyHtml += '</tr>';
            });
            tbody.innerHTML = bodyHtml;
            
            if (currentTable === 'tareas') {
                updateStickyPositions();
            }
            setTimeout(updateScrollbarsWidth, 50);
        }

        function syncAllRowHeights(changedRowElement) {
            const newHeight = changedRowElement.offsetHeight;
            if (newHeight !== globalRowHeight) {
                globalRowHeight = newHeight;
                const allRows = document.querySelectorAll('.sync-row');
                allRows.forEach(row => {
                    row.style.height = `${globalRowHeight}px`;
                });
            }
        }

        function exportToExcel() {
            const dataset = currentTable === 'tareas' ? filteredTableData : currentTableData;
            if (!dataset || dataset.length === 0) {
                alert('No hay datos disponibles para exportar.');
                return;
            }

            const columns = customColumnOrders[currentTable] || dbSchema[currentTable] || [];
            const dataToExport = dataset.map(row => {
                let cleanRow = {};
                columns.forEach(col => {
                    if (col === 'color' && currentTable !== 'tareas') return;
                    if (currentTable === 'tareas' && (col === 'jerarquia' || col === 'apertura')) return;
                    let val = row[col];
                    if (currentTable === 'tareas' && foreignKeyTables[col]) {
                        const relTable = foreignKeyTables[col];
                        val = row[relTable] && row[relTable].nombre ? row[relTable].nombre : '';
                    }
                    cleanRow[col.replace('_', ' ')] = val !== null && val !== undefined ? val : '';
                });
                return cleanRow;
            });

            const worksheet = XLSX.utils.json_to_sheet(dataToExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, currentTable);
            XLSX.writeFile(workbook, `${currentTable}_export.xlsx`);
        }
    </script>
</body>
