<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planilla de Tareas - Vista Árbol</title>
  <style>
    :root {
      --bg: #f4f6f9; --card: #ffffff; --border: #e1e5eb; --text: #1a1d23;
      --muted: #6b7280; --primary: #2563eb; --primary-hover: #1d4ed8;
      --success: #059669; --row-hover: #f8fafc; --indent: 22px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.45;
      padding: 16px; min-height: 100vh;
    }
    .container { max-width: 1400px; margin: 0 auto; }
    header {
      background: var(--card); border-radius: 12px; padding: 18px 22px;
      margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    header h1 span {
      font-size: .85rem; font-weight: 500; color: var(--muted);
      background: #f1f5f9; padding: 3px 10px; border-radius: 20px;
    }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .btn {
      background: var(--primary); color: white; border: none; padding: 8px 14px;
      border-radius: 8px; font-size: .875rem; font-weight: 500; cursor: pointer;
      transition: background .15s; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn.secondary { background: #e2e8f0; color: var(--text); }
    .btn.secondary:hover { background: #cbd5e1; }
    .search-box { position: relative; }
    .search-box input {
      padding: 8px 14px 8px 36px; border: 1px solid var(--border); border-radius: 8px;
      font-size: .875rem; width: 220px; outline: none;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-box::before {
      content: "🔍"; position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: .9rem; opacity: .6;
    }
    .filters-bar {
      background: var(--card); border-radius: 12px; padding: 14px 18px;
      margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06);
      display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label {
      font-size: .72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: .03em;
    }
    .filter-group select, .filter-group input[type="date"] {
      padding: 7px 10px; border: 1px solid var(--border); border-radius: 8px;
      font-size: .84rem; background: #fff; min-width: 140px; outline: none;
    }
    .filter-group select:focus, .filter-group input[type="date"]:focus { border-color: var(--primary); }
    .btn-clear {
      background: #fef2f2; color: #991b1b; border: 1px solid #fecaca;
      padding: 8px 14px; border-radius: 8px; font-size: .84rem; font-weight: 500;
      cursor: pointer; align-self: flex-end;
    }
    .btn-clear:hover { background: #fee2e2; }
    .active-filters { font-size: .8rem; color: var(--muted); width: 100%; margin-top: 2px; }
    .active-filters strong { color: var(--primary); }
    .status-bar { font-size: .8rem; color: var(--muted); margin-bottom: 12px; padding: 0 4px; }
    .tree-wrapper {
      background: var(--card); border-radius: 12px;
      box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; font-size: .84rem; }
    thead { background: #f1f5f9; position: sticky; top: 0; z-index: 10; }
    th {
      text-align: left; padding: 11px 12px; font-weight: 600; color: #334155;
      border-bottom: 2px solid var(--border); white-space: nowrap; user-select: none; cursor: pointer;
    }
    th:hover { background: #e2e8f0; }
    th .sort-icon { margin-left: 4px; opacity: .4; font-size: .7rem; }
    th.sorted-asc .sort-icon::after { content: " ▲"; opacity: 1; }
    th.sorted-desc .sort-icon::after { content: " ▼"; opacity: 1; }
    td { padding: 8px 12px; border-bottom: 1px solid #f1f5f9; vertical-align: top; }
    tr:hover td { background: var(--row-hover); }
    .node-row { cursor: pointer; }
    .node-row td:first-child { display: flex; align-items: center; gap: 6px; font-weight: 600; }
    .toggle {
      width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 4px; background: #e2e8f0; font-size: .7rem; flex-shrink: 0; transition: transform .15s;
    }
    .toggle.open { transform: rotate(90deg); background: #cbd5e1; }
    .node-label { flex: 1; }
    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .72rem; font-weight: 600; white-space: nowrap;
    }
    .badge-count { background: #e0e7ff; color: #3730a3; margin-left: 8px; }
    .level-0 { padding-left: 8px !important; }
    .level-1 { padding-left: calc(8px + var(--indent)) !important; }
    .level-2 { padding-left: calc(8px + var(--indent)*2) !important; }
    .level-3 { padding-left: calc(8px + var(--indent)*3) !important; }
    .level-0 .node-label { color: #1e40af; font-size: .95rem; }
    .level-1 .node-label { color: #0f766e; }
    .level-2 .node-label { color: #7c3aed; }
    .level-3 { font-weight: 400 !important; }
    .estado-finalizada { background: #d1fae5; color: #065f46; }
    .estado-enproceso { background: #fef3c7; color: #92400e; }
    .estado-asignada { background: #dbeafe; color: #1e40af; }
    .estado-reasignada { background: #fce7f3; color: #9d174d; }
    .estado-desistida { background: #fee2e2; color: #991b1b; }
    .estado-sincomenzar { background: #f1f5f9; color: #475569; }
    .estado-default { background: #f1f5f9; color: #64748b; }
    .situacion-validado { background: #d1fae5; color: #065f46; }
    .situacion-esperando { background: #fef3c7; color: #92400e; }
    .situacion-reasignado { background: #fce7f3; color: #9d174d; }
    .situacion-incompleta { background: #fee2e2; color: #991b1b; }
    .situacion-default { background: #f1f5f9; color: #64748b; }
    .avance-bar {
      height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden;
      width: 70px; display: inline-block; vertical-align: middle; margin-right: 6px;
    }
    .avance-fill { height: 100%; background: var(--success); border-radius: 4px; }
    .obs-cell { max-width: 280px; white-space: pre-wrap; font-size: .8rem; color: #475569; }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 1.1rem; }
    footer { text-align: center; margin-top: 18px; font-size: .75rem; color: var(--muted); }
    @media (max-width: 900px) {
      .search-box input { width: 160px; }
      th, td { padding: 7px 8px; font-size: .8rem; }
      .obs-cell { max-width: 180px; }
    }
  </style>
</head>

    const SHEET_ID = '1UZZfk9muu5nYuJCYpoRueC0RLyxuYm2thrkOFnfemrY';

    function loadData(forceLive) {
      document.getElementById('content').innerHTML = '<div class="loading">Cargando planilla</div>';
      document.getElementById('status').textContent = forceLive
        ? 'Intentando actualizar desde Google Sheets...'
        : 'Cargando datos...';

      // Siempre arrancar con los datos embebidos (rápido y confiable)
      rawRows = EMBEDDED_DATA.slice();
      document.getElementById('status').textContent =
        'Datos cargados (' + rawRows.length + ' tareas). ' +
        (forceLive ? 'Intentando actualizar en vivo...' : 'Usá ↻ para intentar actualizar desde la planilla.');
      populateFilterOptions();
      applyFiltersAndRender();

      if (forceLive) {
        tryLiveUpdate();
      }
    }

    function tryLiveUpdate() {
      // Intentar gviz (respeta filtros de la planilla)
      window._gvizDone = false;
      window.handleGoogleData = function(response) {
        if (window._gvizDone) return;
        window._gvizDone = true;
        try {
          if (!response || response.status !== 'ok') return;
          const cols = response.table.cols.map(c => (c.label || c.id || '').trim());
          const mapped = (response.table.rows || []).map(r => {
            const obj = {};
            cols.forEach((col, i) => {
              if (!col) return;
              const cell = r.c && r.c[i];
              const val = cell ? (cell.f != null ? cell.f : (cell.v != null ? cell.v : '')) : '';
              obj[col] = String(val).trim();
            });
            return obj;
          }).filter(r => {
            const e = (r['Etapa'] || '').trim();
            const t = (r['Tarea'] || '').trim();
            return e && e !== '_' && t;
          }).map(r => ({
            etapa: r['Etapa'] || '',
            actividad: r['Actividad'] || '',
            tarea: r['Tarea'] || '',
            estado: r['Estado'] || '',
            situacion: r['Situacion'] || '',
            asignado: r['Asignado'] || '',
            fechaAsig: r['Fecha Asignada'] || '',
            fechaVenc: r['Fecha   Vencim'] || r['Fecha Vencim'] || '',
            fechaEntrega: r['Fecha Entrega'] || '',
            avance: r['% Avance'] || '',
            observaciones: r['Observaciones'] || '',
            origen: r['Origen'] || ''
          }));

          if (mapped.length >= 20) {
            rawRows = mapped;
            document.getElementById('status').textContent =
              'Actualizado en vivo: ' + new Date().toLocaleString('es-UY') + ' · ' + rawRows.length + ' filas';
            populateFilterOptions();
            applyFiltersAndRender();
          } else {
            document.getElementById('status').textContent =
              'Se mantuvieron los datos embebidos (' + rawRows.length + '). En vivo solo llegaron ' +
              mapped.length + ' filas (¿filtro activo en la planilla?).';
          }
        } catch (e) { console.warn(e); }
      };

      const s = document.createElement('script');
      s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
        '/gviz/tq?tqx=out:json;responseHandler:handleGoogleData&_=' + Date.now();
      s.onerror = function() {
        document.getElementById('status').textContent =
          'Datos embebidos (' + rawRows.length + ' tareas). No se pudo conectar en vivo.';
      };
      document.body.appendChild(s);
    }

    function populateFilterOptions() {
      const unique = (key) => [...new Set(rawRows.map(r => r[key]).filter(v => v && v !== '_'))]
        .sort((a, b) => a.localeCompare(b, 'es'));
      fillSelect('filter-etapa', unique('etapa'), 'Todas');
      fillSelect('filter-actividad', unique('actividad'), 'Todas');
      fillSelect('filter-estado', unique('estado'), 'Todos');
      fillSelect('filter-situacion', unique('situacion'), 'Todas');
      fillSelect('filter-asignado', unique('asignado'), 'Todos');
    }

    function fillSelect(id, values, emptyLabel) {
      const sel = document.getElementById(id);
      const cur = sel.value;
      sel.innerHTML = '<option value="">' + emptyLabel + '</option>';
      values.forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = v;
        sel.appendChild(o);
      });
      if (cur && values.includes(cur)) sel.value = cur;
    }

    function applyFiltersAndRender() {
      filters.etapa = document.getElementById('filter-etapa').value;
      filters.actividad = document.getElementById('filter-actividad').value;
      filters.estado = document.getElementById('filter-estado').value;
      filters.situacion = document.getElementById('filter-situacion').value;
      filters.asignado = document.getElementById('filter-asignado').value;
      filters.fechaDesde = document.getElementById('filter-fecha-desde').value;
      filters.fechaHasta = document.getElementById('filter-fecha-hasta').value;

      filteredRows = rawRows.filter(r => {
        if (filters.etapa && r.etapa !== filters.etapa) return false;
        if (filters.actividad && r.actividad !== filters.actividad) return false;
        if (filters.estado && r.estado !== filters.estado) return false;
        if (filters.situacion && r.situacion !== filters.situacion) return false;
        if (filters.asignado && r.asignado !== filters.asignado) return false;
        if (filters.fechaDesde || filters.fechaHasta) {
          const ts = parseDate(r.fechaAsig);
          if (ts == null) return false;
          if (filters.fechaDesde && ts < new Date(filters.fechaDesde + 'T00:00:00').getTime()) return false;
          if (filters.fechaHasta && ts > new Date(filters.fechaHasta + 'T23:59:59').getTime()) return false;
        }
        return true;
      });

      const total = rawRows.length, shown = filteredRows.length;
      document.getElementById('row-count').textContent =
        shown === total ? total + ' tareas' : shown + ' de ' + total + ' tareas';

      const active = [];
      if (filters.etapa) active.push('Etapa: ' + filters.etapa);
      if (filters.actividad) active.push('Actividad: ' + filters.actividad);
      if (filters.estado) active.push('Estado: ' + filters.estado);
      if (filters.situacion) active.push('Situación: ' + filters.situacion);
      if (filters.asignado) active.push('Asignado: ' + filters.asignado);
      if (filters.fechaDesde) active.push('Desde: ' + filters.fechaDesde);
      if (filters.fechaHasta) active.push('Hasta: ' + filters.fechaHasta);
      document.getElementById('active-filters').innerHTML = active.length
        ? 'Filtros activos: <strong>' + active.join(' · ') + '</strong>' : '';

      buildTree();
      render();
    }

    function clearFilters() {
      ['filter-etapa','filter-actividad','filter-estado','filter-situacion',
       'filter-asignado','filter-fecha-desde','filter-fecha-hasta'].forEach(id => {
        document.getElementById(id).value = '';
      });
      applyFiltersAndRender();
    }

    function buildTree() {
      const map = {};
      filteredRows.forEach((row, idx) => {
        const e = row.etapa || '(Sin Etapa)';
        const a = row.actividad || '(Sin Actividad)';
        const t = row.tarea || '(Sin Tarea)';
        if (!map[e]) map[e] = { type: 'etapa', name: e, children: {}, count: 0 };
        if (!map[e].children[a]) map[e].children[a] = { type: 'actividad', name: a, children: {}, count: 0 };
        if (!map[e].children[a].children[t])
          map[e].children[a].children[t] = { type: 'tarea', name: t, rows: [], count: 0 };
        map[e].children[a].children[t].rows.push(Object.assign({}, row, { _id: idx }));
        map[e].children[a].children[t].count++;
        map[e].children[a].count++;
        map[e].count++;
      });
      treeData = Object.values(map).map(etapa => ({
        ...etapa,
        id: 'e-' + etapa.name,
        children: Object.values(etapa.children).map(act => ({
          ...act,
          id: 'a-' + etapa.name + '|' + act.name,
          children: Object.values(act.children).map(tar => ({
            ...tar,
            id: 't-' + etapa.name + '|' + act.name + '|' + tar.name,
            leaves: tar.rows
          }))
        }))
      }));
      treeData.sort((a, b) => a.name.localeCompare(b.name, 'es'));
    }

    function render() {
      const filtered = applySearch(treeData);
      let html = '<table><thead><tr>' +
        '<th data-col="nombre" style="min-width:280px">Jerarquía (Etapa / Actividad / Tarea / Fecha) <span class="sort-icon"></span></th>' +
        '<th data-col="estado">Estado <span class="sort-icon"></span></th>' +
        '<th data-col="situacion">Situación <span class="sort-icon"></span></th>' +
        '<th data-col="asignado">Asignado <span class="sort-icon"></span></th>' +
        '<th data-col="fechaAsig">F. Asignada <span class="sort-icon"></span></th>' +
        '<th data-col="fechaVenc">F. Vencimiento <span class="sort-icon"></span></th>' +
        '<th data-col="fechaEntrega">F. Entrega <span class="sort-icon"></span></th>' +
        '<th data-col="avance">% Avance <span class="sort-icon"></span></th>' +
        '<th data-col="observaciones">Observaciones</th>' +
        '</tr></thead><tbody>';
      filtered.forEach(etapa => { html += renderNode(etapa, 0); });
      html += '</tbody></table>';
      document.getElementById('content').innerHTML = html ||
        '<div class="loading" style="padding:40px">No hay resultados</div>';

      document.querySelectorAll('.node-row').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.dataset.id;
          if (expanded.has(id)) expanded.delete(id); else expanded.add(id);
          render();
        });
      });
      document.querySelectorAll('th[data-col]').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.col;
          if (sortCol === col) sortDir *= -1; else { sortCol = col; sortDir = 1; }
          if (sortCol === 'nombre') treeData.sort((a, b) => a.name.localeCompare(b.name, 'es') * sortDir);
          render();
        });
        if (th.dataset.col === sortCol)
          th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
      });
    }

    function renderNode(node, level) {
      const isOpen = expanded.has(node.id);
      const hasChildren = (node.children && node.children.length) || (node.leaves && node.leaves.length);
      let html = '';
      html += '<tr class="node-row" data-id="' + node.id + '">' +
        '<td class="level-' + level + '">' +
        (hasChildren ? '<span class="toggle ' + (isOpen ? 'open' : '') + '">▶</span>' : '<span style="width:20px"></span>') +
        '<span class="node-label">' + escapeHtml(node.name) + '</span>' +
        '<span class="badge badge-count">' + node.count + '</span>' +
        '</td><td colspan="8"></td></tr>';
      if (isOpen) {
        if (node.children) {
          let kids = node.children.slice();
          if (sortCol === 'nombre') kids.sort((a, b) => a.name.localeCompare(b.name, 'es') * sortDir);
          kids.forEach(ch => { html += renderNode(ch, level + 1); });
        }
        if (node.leaves) {
          let leaves = node.leaves.slice();
          if (sortCol && sortCol !== 'nombre')
            leaves.sort((a, b) => compareVal(a[sortCol], b[sortCol]) * sortDir);
          else if (sortCol === 'nombre')
            leaves.sort((a, b) => compareVal(a.fechaAsig, b.fechaAsig) * sortDir);
          leaves.forEach(leaf => { html += renderLeaf(leaf, level + 1); });
        }
      }
      return html;
    }

    function renderLeaf(row, level) {
      const avanceNum = parseInt(row.avance) || 0;
      return '<tr>' +
        '<td class="level-' + level + '" style="font-weight:400">' +
        '<span style="width:20px;display:inline-block"></span>' +
        '<span class="node-label" style="color:#64748b;font-size:.82rem">📅 ' + escapeHtml(row.fechaAsig || '—') + '</span></td>' +
        '<td><span class="badge ' + getEstadoClass(row.estado) + '">' + escapeHtml(row.estado || '—') + '</span></td>' +
        '<td><span class="badge ' + getSituacionClass(row.situacion) + '">' + escapeHtml(row.situacion || '—') + '</span></td>' +
        '<td>' + escapeHtml(row.asignado || '—') + '</td>' +
        '<td>' + escapeHtml(row.fechaAsig || '—') + '</td>' +
        '<td>' + escapeHtml(row.fechaVenc || '—') + '</td>' +
        '<td>' + escapeHtml(row.fechaEntrega || '—') + '</td>' +
        '<td>' + (row.avance !== '' ?
          '<div class="avance-bar"><div class="avance-fill" style="width:' + Math.min(avanceNum,100) + '%"></div></div>' + avanceNum + '%'
          : '—') + '</td>' +
        '<td class="obs-cell">' + escapeHtml(row.observaciones || '') + '</td></tr>';
    }

    function applySearch(nodes) {
      if (!searchTerm) return nodes;
      const term = searchTerm.toLowerCase();
      function filterNode(node) {
        if (node.type === 'tarea') {
          const matching = (node.leaves || []).filter(l =>
            Object.values(l).some(v => String(v).toLowerCase().includes(term)));
          if (!matching.length && !node.name.toLowerCase().includes(term)) return null;
          return Object.assign({}, node, {
            leaves: matching.length ? matching : node.leaves,
            count: matching.length || node.count
          });
        }
        const kids = (node.children || []).map(filterNode).filter(Boolean);
        if (!kids.length && !node.name.toLowerCase().includes(term)) return null;
        return Object.assign({}, node, {
          children: kids,
          count: kids.reduce((s, c) => s + c.count, 0) || node.count
        });
      }
      return nodes.map(filterNode).filter(Boolean);
    }

    function compareVal(a, b) {
      const da = parseDate(a), db = parseDate(b);
      if (da && db) return da - db;
      const na = parseFloat(a), nb = parseFloat(b);
      if (!isNaN(na) && !isNaN(nb)) return na - nb;
      return String(a || '').localeCompare(String(b || ''), 'es');
    }
    function parseDate(str) {
      if (!str) return null;
      const m = String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      return m ? new Date(+m[3], +m[2]-1, +m[1]).getTime() : null;
    }
    function getEstadoClass(e) {
      const s = (e || '').toLowerCase();
      if (s.includes('finalizada')) return 'estado-finalizada';
      if (s.includes('proceso')) return 'estado-enproceso';
      if (s.includes('asignada')) return 'estado-asignada';
      if (s.includes('reasignada')) return 'estado-reasignada';
      if (s.includes('desistida')) return 'estado-desistida';
      if (s.includes('comenzar') || s.includes('sin')) return 'estado-sincomenzar';
      return 'estado-default';
    }
    function getSituacionClass(s) {
      const t = (s || '').toLowerCase();
      if (t.includes('validado')) return 'situacion-validado';
      if (t.includes('esperando') || t.includes('revision')) return 'situacion-esperando';
      if (t.includes('reasignado')) return 'situacion-reasignado';
      if (t.includes('incompleta')) return 'situacion-incompleta';
      return 'situacion-default';
    }
    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    document.getElementById('btn-expand').addEventListener('click', () => {
      (function collect(nodes) {
        nodes.forEach(n => { expanded.add(n.id); if (n.children) collect(n.children); });
      })(treeData);
      render();
    });
    document.getElementById('btn-collapse').addEventListener('click', () => {
      expanded.clear(); render();
    });
    document.getElementById('btn-refresh').addEventListener('click', () => loadData(true));

    let searchTimeout;
    document.getElementById('search').addEventListener('input', e => {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        searchTerm = e.target.value.trim();
        if (searchTerm) {
          (function collect(nodes) {
            nodes.forEach(n => { expanded.add(n.id); if (n.children) collect(n.children); });
          })(treeData);
        }
        render();
      }, 250);
    });

    ['filter-etapa','filter-actividad','filter-estado','filter-situacion',
     'filter-asignado','filter-fecha-desde','filter-fecha-hasta'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        expanded.clear();
        applyFiltersAndRender();
        (function collect(nodes) {
          nodes.forEach(n => { expanded.add(n.id); if (n.children) collect(n.children); });
        })(treeData);
        render();
      });
    });
    document.getElementById('btn-clear-filters').addEventListener('click', () => {
      expanded.clear(); clearFilters();
    });

    // Carga inmediata con datos embebidos (sin esperar red)
    loadData(false);
  </script>
</body>
</html>
