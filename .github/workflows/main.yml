name: Actualizacion Automatica desde Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar librerías necesarias
      run: pip install requests

    - name: Descargar Excel con Python Puro
      run: |
        python -c "
        import requests
        
        # ID real de tu Hoja de Cálculo
        SPREADSHEET_ID = '1UZZfk9muu5nYuJCYpoRueC0RLyxuYm2thrkOFnfemrY'
        OUTPUT_NAME = 'tareas.xlsx'
        
        # URL de exportación forzada
        url = f'https://docs.google.com/spreadsheets/d/{SPREADSHEET_ID}/export?format=xlsx'
        
        # Enviamos una cabecera de navegador estándar para que Google no sospeche de un bot
        headers = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64)'}
        
        response = requests.get(url, headers=headers)
        
        # Verificación del tamaño del archivo para asegurar que traiga datos
        if response.status_code == 200 and len(response.content) > 5000:
            with open(OUTPUT_NAME, 'wb') as f:
                f.write(response.content)
            print('Excel binario real descargado con éxito.')
        else:
            print('Error: El archivo descargado está vacío o Google bloqueó la petición.')
            print(f'Código de estado: {response.status_code}. Tamaño: {len(response.content)} bytes.')
            exit(1)
        "

    - name: Confirmar y subir cambios a GitHub
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add tareas.xlsx
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización definitiva de tareas.xlsx" && git push)
