name: Actualizacion Automatica desde Google Sheets

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Instalar gdown
      run: pip install gdown

    - name: Descargar Excel con gdown
      run: |
        gdown --id 1UZZfk9muu5nYuJCYpoRueC0RLyxuYm2thrkOFnfemrY -O tareas.xlsx --format xlsx

    - name: Confirmar y subir cambios a GitHub
      run: |
        git config --local user.email "github-actions[bot]@://github.com"
        git config --local user.name "github-actions[bot]"
        git add tareas.xlsx
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización corregida con gdown" && git push)
