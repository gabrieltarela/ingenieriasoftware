<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gantt-IS-2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f7f8fa;
  --panel: #ffffff;
  --border: #e2e6ed;
  --text: #1a1d26;
  --text-muted: #5c6578;
  --accent: #3b5bdb;
  --today: #e03131;
  --row-h: 36px;
  --left-w: 340px;
  --day-w: 28px;
  --header-h: 52px;
  --font-serif: 'IBM Plex Serif', Georgia, serif;
  --font-sans: 'IBM Plex Sans', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
  flex-shrink: 0;
}
.toolbar h1 {
  font-family: var(--font-serif);
  font-size: 1.15rem;
  font-weight: 700;
  margin-right: auto;
  letter-spacing: -0.02em;
}
.toolbar label {
  font-size: 0.8rem;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 6px;
}
.toolbar select, .toolbar button, .toolbar .file-btn {
  font-family: var(--font-sans);
  font-size: 0.8rem;
  padding: 5px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  color: var(--text);
}
.toolbar button:hover, .toolbar .file-btn:hover { background: #f0f2f5; }
.toolbar input[type="checkbox"] { accent-color: var(--accent); }
.toolbar input[type="file"] { display: none; }

.last-mod-badge {
  font-size: 0.75rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  background: #f0f2f5;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}

.status-bar {
  font-size: 0.75rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  padding: 0 4px;
}
.status-bar.ok { color: #2b8a3e; }
.status-bar.err { color: #c92a2a; }
.status-bar.loading { color: #e67700; }

.main {
  display: flex;
  flex: 1;
  overflow: hidden;
  position: relative;
}
.left-panel {
  width: var(--left-w);
  min-width: 260px;
  max-width: 480px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  z-index: 2;
}
.left-header {
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 12px;
  font-size: 0.75rem;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
  flex-shrink: 0;
}
.left-body {
  overflow-y: auto;
  overflow-x: hidden;
  flex: 1;
}
.right-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}
.right-header {
  height: var(--header-h);
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  flex-shrink: 0;
  background: var(--panel);
  position: relative;
}
.right-body {
  flex: 1;
  overflow: auto;
  position: relative;
  scrollbar-gutter: stable;
}

.row {
  height: var(--row-h);
  display: flex;
  align-items: center;
  border-bottom: 1px solid #f0f2f5;
  padding: 0 8px;
  font-size: 0.82rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  position: relative;
  cursor: default;
}
.row:hover { background: #f4f6f9; }
.row.etapa {
  font-weight: 600;
  background: #eef1f7;
  font-family: var(--font-serif);
  font-size: 0.88rem;
}
.row.actividad {
  font-weight: 500;
  background: #f7f8fb;
  padding-left: 20px;
}
.row.tarea { padding-left: 40px; }

.toggle {
  display: inline-flex;
  width: 18px;
  height: 18px;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  margin-right: 4px;
  border-radius: 3px;
  font-size: 0.7rem;
  color: var(--text-muted);
  flex-shrink: 0;
  user-select: none;
}
.toggle:hover { background: #e2e6ed; color: var(--text); }
.toggle.collapsed::before { content: '▶'; }
.toggle.expanded::before { content: '▼'; }

.row-label {
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.badge {
  font-size: 0.65rem;
  padding: 1px 6px;
  border-radius: 3px;
  margin-left: 6px;
  font-family: var(--font-mono);
  flex-shrink: 0;
}
.badge.estado-finalizada { background: #d3f9d8; color: #2b8a3e; }
.badge.estado-en-proceso { background: #fff3bf; color: #e67700; }
.badge.estado-sin-comenzar { background: #e9ecef; color: #868e96; }

.timeline-header-inner {
  display: flex;
  height: 100%;
  position: relative;
}
.month-group {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}
.month-label {
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.7rem;
  font-weight: 600;
  font-family: var(--font-mono);
  background: #f0f2f5;
  border-bottom: 1px solid var(--border);
  color: var(--text-muted);
}
.days-row { display: flex; height: 30px; }
.day-cell {
  width: var(--day-w);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.65rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  border-right: 1px solid #f0f2f5;
}
.day-cell.weekend { background: #fafbfc; color: #adb5bd; }
.day-cell.today { background: #ffe3e3; color: var(--today); font-weight: 600; }

.timeline-body-inner { position: relative; }
.timeline-row {
  height: var(--row-h);
  border-bottom: 1px solid #f0f2f5;
  position: relative;
}
.timeline-row.etapa { background: #eef1f7; }
.timeline-row.actividad { background: #f7f8fb; }

.grid-lines {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  pointer-events: none;
  display: flex;
}
.grid-day {
  width: var(--day-w);
  border-right: 1px solid #f0f2f5;
  height: 100%;
}
.grid-day.weekend { background: rgba(0,0,0,0.015); }

.bar {
  position: absolute;
  top: 6px;
  height: calc(var(--row-h) - 12px);
  border-radius: 3px;
  display: flex;
  align-items: center;
  padding: 0 6px;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  font-weight: 500;
  overflow: hidden;
  white-space: nowrap;
  cursor: pointer;
  transition: opacity 0.15s, filter 0.15s;
  z-index: 1;
}
.bar.summary {
  top: 10px;
  height: calc(var(--row-h) - 20px);
  opacity: 0.35;
  border-radius: 2px;
  pointer-events: none;
  z-index: 0;
}
.bar.estimated {
  border-style: dashed !important;
  background-image: repeating-linear-gradient(
    -45deg, transparent, transparent 3px,
    rgba(255,255,255,0.35) 3px, rgba(255,255,255,0.35) 6px
  ) !important;
}
.bar.dimmed { opacity: 0.18; filter: grayscale(0.6); }
.bar .assignee { overflow: hidden; text-overflow: ellipsis; }

.bar.estado-finalizada { border: 1px solid transparent; }
.bar.estado-en-proceso {
  background-image: repeating-linear-gradient(
    45deg, transparent, transparent 4px,
    rgba(255,255,255,0.25) 4px, rgba(255,255,255,0.25) 8px
  );
  border: 1.5px solid;
}
.bar.estado-sin-comenzar {
  background: transparent !important;
  border: 1.5px dashed;
  color: inherit;
}

.person-gabriel { --p: #4c6ef5; --pbg: #dbe4ff; }
.person-lucia   { --p: #0ca678; --pbg: #c3fae8; }
.person-luciano { --p: #7950f2; --pbg: #e5dbff; }
.person-ignacio { --p: #f76707; --pbg: #ffe8cc; }
.person-none    { --p: #868e96; --pbg: #e9ecef; }

.bar.person-gabriel { background: var(--pbg); color: #364fc7; border-color: var(--p); }
.bar.person-lucia   { background: var(--pbg); color: #087f5b; border-color: var(--p); }
.bar.person-luciano { background: var(--pbg); color: #5f3dc4; border-color: var(--p); }
.bar.person-ignacio { background: var(--pbg); color: #d9480f; border-color: var(--p); }
.bar.person-none    { background: var(--pbg); color: #495057; border-color: var(--p); }

.bar.summary.etapa-analisis { background: #91a7ff; }
.bar.summary.etapa-disenio  { background: #b197fc; }
.bar.summary.act            { background: #adb5bd; }

.today-line {
  position: absolute;
  top: 0; bottom: 0;
  width: 2px;
  background: var(--today);
  z-index: 5;
  pointer-events: none;
}
.today-line::before {
  content: 'HOY';
  position: absolute;
  top: 2px; left: 4px;
  font-size: 0.6rem;
  font-weight: 700;
  color: var(--today);
  font-family: var(--font-mono);
  background: #fff;
  padding: 0 3px;
  border-radius: 2px;
}

.tooltip {
  position: fixed;
  z-index: 100;
  background: #1a1d26;
  color: #f1f3f5;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 0.78rem;
  max-width: 340px;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.12s;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  line-height: 1.45;
}
.tooltip.visible { opacity: 1; }
.tooltip strong { color: #fff; font-weight: 600; }
.tooltip .tt-path { color: #adb5bd; font-size: 0.72rem; margin-bottom: 4px; }
.tooltip .tt-row { display: flex; gap: 8px; }
.tooltip .tt-label { color: #868e96; min-width: 70px; }
.tooltip .tt-obs {
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid #343a40;
  color: #ced4da;
  font-style: italic;
}

.legend {
  display: flex;
  gap: 16px;
  padding: 8px 16px;
  background: var(--panel);
  border-top: 1px solid var(--border);
  font-size: 0.72rem;
  color: var(--text-muted);
  flex-wrap: wrap;
  flex-shrink: 0;
  align-items: center;
}
.legend-item { display: flex; align-items: center; gap: 5px; }
.legend-swatch {
  width: 14px; height: 10px;
  border-radius: 2px;
  border: 1px solid transparent;
}
.legend-swatch.finalizada { background: #dbe4ff; border-color: #4c6ef5; }
.legend-swatch.en-proceso {
  background: repeating-linear-gradient(45deg, #dbe4ff, #dbe4ff 3px, #fff 3px, #fff 6px);
  border: 1.5px solid #4c6ef5;
}
.legend-swatch.sin-comenzar {
  background: transparent;
  border: 1.5px dashed #868e96;
}
.legend-swatch.estimated {
  background: repeating-linear-gradient(-45deg, #e9ecef, #e9ecef 2px, #fff 2px, #fff 4px);
  border: 1.5px dashed #adb5bd;
}
.legend-swatch.person { width: 12px; height: 12px; border-radius: 50%; }

.resizer {
  width: 5px;
  cursor: col-resize;
  background: transparent;
  position: absolute;
  top: 0; bottom: 0;
  left: var(--left-w);
  z-index: 10;
  transform: translateX(-2px);
}
.resizer:hover, .resizer.dragging { background: var(--accent); }

.loading-overlay {
  position: absolute;
  inset: 0;
  background: rgba(247,248,250,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 50;
  gap: 12px;
}
.loading-overlay.hidden { display: none; }
.loading-overlay p { color: var(--text-muted); font-size: 0.9rem; }
.spinner {
  width: 32px; height: 32px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error-box {
  max-width: 480px;
  padding: 20px 24px;
  background: #fff;
  border: 1px solid #ffc9c9;
  border-radius: 8px;
  text-align: center;
  line-height: 1.5;
}
.error-box h3 { color: #c92a2a; margin-bottom: 8px; font-family: var(--font-serif); }
.error-box code { background: #f1f3f5; padding: 2px 6px; border-radius: 3px; font-family: var(--font-mono); font-size: 0.85em; }
</style>
</head>
<body>

<div class="toolbar">
    <span id="lastModifiedText" class="last-mod-badge">GANTT: </span>
  <span class="status-bar" id="statusBar">Cargando…</span>
  <label class="file-btn" title="Seleccionar tareas.xlsx manualmente">
    📂 Cargar Excel
    <input type="file" id="fileInput" accept=".xlsx,.xls">
  </label>
  <label>
    Asignado:
    <select id="filterPerson"><option value="">Todos</option></select>
  </label>
  <label>
    <input type="checkbox" id="showEstimated" checked> Mostrar estimadas
  </label>
  <button id="btnExpand" title="Expandir todo">▾ Expandir</button>
  <button id="btnCollapse" title="Colapsar todo">▸ Colapsar</button>
  <label>
    Zoom:
    <button id="zoomOut" title="Menos detalle">−</button>
    <button id="zoomIn" title="Más detalle">+</button>
  </label>
  <button id="btnReload" title="Recargar tareas.xlsx">↻ Recargar</button>
</div>

<div class="main">
  <div class="left-panel" id="leftPanel">
    <div class="left-header">Etapa / Actividad / Tarea</div>
    <div class="left-body" id="leftBody"></div>
  </div>
  <div class="resizer" id="resizer"></div>
  <div class="right-panel">
    <div class="right-header" id="rightHeader"></div>
    <div class="right-body" id="rightBody">
      <div class="timeline-body-inner" id="timelineInner"></div>
    </div>
  </div>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p id="loadingMsg">Leyendo <code>tareas.xlsx</code>…</p>
  </div>
</div>

<div class="legend" id="legend">
  <span style="font-weight:600;color:var(--text)">Estados:</span>
  <div class="legend-item"><div class="legend-swatch finalizada"></div> Finalizada</div>
  <div class="legend-item"><div class="legend-swatch en-proceso"></div> En Proceso / Revisión</div>
  <div class="legend-item"><div class="legend-swatch sin-comenzar"></div> Sin Comenzar</div>
  <div class="legend-item"><div class="legend-swatch estimated"></div> Estimada (sin fecha real)</div>
  <span style="margin-left:12px;font-weight:600;color:var(--text)">Personas:</span>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const EXCEL_FILENAME = 'tareas.xlsx';

const state = {
  dayWidth: 28,
  showEstimated: true,
  filterPerson: '',
  collapsed: new Set(),
  today: new Date().toISOString().slice(0, 10),
  tree: null,
  tasks: null
};

const PERSON_COLORS = {
  gabriel: 'person-gabriel',
  lucia: 'person-lucia',
  luciano: 'person-luciano',
  ignacio: 'person-ignacio'
};
const NAME_PRETTY = {
  lucia: 'Lucía',
  luciano: 'Luciano',
  gabriel: 'Gabriel',
  ignacio: 'Ignacio'
};
const MONTH_NAMES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

function formatDateTime(date) {
  if (!date || isNaN(date.getTime())) return 'Desconocida';
  return date.toLocaleString('es-UY', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  });
}

function updateLastModifiedUI(date) {
  var el = document.getElementById('lastModifiedText');
  if (el) {
    if (date) {
      el.innerHTML = '📅 <strong>VERSION:</strong> ' + formatDateTime(date);
    } else {
      el.innerHTML = '📅 <strong>Modificado:</strong> No disponible';
    }
  }
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
}
function cleanStr(v) {
  if (v == null) return null;
  const s = String(v).trim();
  if (!s || s === 'nan' || s === 'None' || s === '_' || s === 'NaN') return null;
  return s;
}
function excelDateToISO(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') {
    const d = XLSX.SSF.parse_date_code(v);
    if (!d) return null;
    return d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0');
  }
  if (v instanceof Date) {
    return v.toISOString().slice(0, 10);
  }
  const s = String(v).trim();
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const d = new Date(s);
  if (!isNaN(d.getTime())) return d.toISOString().slice(0, 10);
  return null;
}
function parseDate(s) {
  if (!s) return null;
  const parts = s.split('-').map(Number);
  return new Date(parts[0], parts[1] - 1, parts[2]);
}
function formatDate(s) {
  if (!s) return '—';
  const d = parseDate(s);
  return d.toLocaleDateString('es-UY', { day: '2-digit', month: 'short', year: 'numeric' });
}
function daysBetween(a, b) {
  return Math.round((parseDate(b) - parseDate(a)) / 86400000);
}
function addDays(s, n) {
  const d = parseDate(s);
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}
function personClass(norm) { return PERSON_COLORS[norm] || 'person-none'; }
function estadoClass(est) {
  if (!est) return 'estado-sin-comenzar';
  const e = est.toLowerCase();
  if (e.indexOf('finaliz') >= 0) return 'estado-finalizada';
  if (e.indexOf('proceso') >= 0 || e.indexOf('revision') >= 0 || e.indexOf('revisión') >= 0) return 'estado-en-proceso';
  return 'estado-sin-comenzar';
}
function initials(name) {
  if (!name) return '?';
  return name.split(/\s+/).map(function(p) { return p[0]; }).join('').toUpperCase().slice(0, 2);
}

function processWorkbook(wb) {
  const sheetName = wb.SheetNames[0];
  const sheet = wb.Sheets[sheetName];
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, raw: true });

  if (!rows.length) throw new Error('La hoja está vacía');

  var headerIdx = 0;
  for (var i = 0; i < Math.min(5, rows.length); i++) {
    var r = (rows[i] || []).map(function(c) { return (cleanStr(c) || '').toLowerCase(); });
    if (r.indexOf('etapa') >= 0 || r.indexOf('tarea') >= 0) { headerIdx = i; break; }
  }
  var header = (rows[headerIdx] || []).map(function(c) { return cleanStr(c) || ''; });

  var col = {};
  header.forEach(function(h, i) {
    var k = (h || '').toLowerCase().replace(/\s+/g, ' ').trim();
    if (k.indexOf('etapa') >= 0) col.etapa = i;
    else if (k.indexOf('actividad') >= 0) col.actividad = i;
    else if (k === 'tarea' || k.indexOf('tarea') === 0) col.tarea = i;
    else if (k.indexOf('estado') >= 0) col.estado = i;
    else if (k.indexOf('situacion') >= 0 || k.indexOf('situación') >= 0) col.situacion = i;
    else if (k.indexOf('asignado') >= 0) col.asignado = i;
    else if (k.indexOf('fecha asignada') >= 0 || k.indexOf('fecha asign') >= 0) col.fechaAsignada = i;
    else if (k.indexOf('vencim') >= 0) col.fechaVencim = i;
    else if (k.indexOf('entrega') >= 0) col.fechaEntrega = i;
    else if (k.indexOf('observacion') >= 0) col.observaciones = i;
    else if (k.indexOf('origen') >= 0) col.origen = i;
  });

  if (col.tarea == null) throw new Error('No se encontró la columna "Tarea"');

  var tasks = [];
  var lastEtapa = null;

  for (var i = headerIdx + 1; i < rows.length; i++) {
    var row = rows[i];
    if (!row || !row.length) continue;

    var tarea = cleanStr(row[col.tarea]);
    if (!tarea) continue;

    var etapa = cleanStr(row[col.etapa]);
    if (etapa) lastEtapa = etapa;
    else etapa = lastEtapa;

    var actividad = cleanStr(row[col.actividad]);
    var estado = cleanStr(row[col.estado]);
    var situacion = cleanStr(row[col.situacion]);
    var asignado = cleanStr(row[col.asignado]);
    var obs = cleanStr(row[col.observaciones]);
    var origen = cleanStr(row[col.origen]);

    var start = excelDateToISO(row[col.fechaAsignada]);
    var endVenc = excelDateToISO(row[col.fechaVencim]);
    var endEnt = excelDateToISO(row[col.fechaEntrega]);
    var end = endEnt || endVenc || start || null;
    var hasDate = !!(start || end);

    var asignadoNorm = asignado ? stripAccents(asignado) : null;
    if (asignadoNorm && NAME_PRETTY[asignadoNorm]) {
      asignado = NAME_PRETTY[asignadoNorm];
    }

    tasks.push({
      etapa: etapa || 'Sin Etapa',
      actividad: actividad || 'Sin Actividad',
      tarea: tarea,
      estado: estado,
      situacion: situacion,
      asignado: asignado,
      asignadoNorm: asignadoNorm,
      start: start,
      end: end,
      hasDate: hasDate,
      isEstimated: false,
      observaciones: obs,
      origen: origen,
      order: tasks.length
    });
  }

  var maxEnd = null;
  tasks.forEach(function(t) {
    if (t.end && (!maxEnd || t.end > maxEnd)) maxEnd = t.end;
    if (t.start && (!maxEnd || t.start > maxEnd)) maxEnd = t.start;
  });
  var cursor = maxEnd ? addDays(maxEnd, 2) : state.today;
  tasks.forEach(function(t) {
    if (!t.hasDate) {
      t.start = cursor;
      t.end = cursor;
      t.isEstimated = true;
      cursor = addDays(cursor, 1);
    }
  });

  var hierarchy = new Map();
  tasks.forEach(function(t) {
    if (!hierarchy.has(t.etapa)) hierarchy.set(t.etapa, new Map());
    var acts = hierarchy.get(t.etapa);
    if (!acts.has(t.actividad)) acts.set(t.actividad, []);
    acts.get(t.actividad).push(t);
  });

  var tree = [];
  hierarchy.forEach(function(acts, etName) {
    var etStarts = [], etEnds = [];
    var actList = [];
    acts.forEach(function(tlist, acName) {
      var starts = tlist.map(function(t) { return t.start; }).filter(Boolean);
      var ends = tlist.map(function(t) { return t.end; }).filter(Boolean);
      var acStart = starts.length ? starts.reduce(function(a, b) { return a < b ? a : b; }) : null;
      var acEnd = ends.length ? ends.reduce(function(a, b) { return a > b ? a : b; }) : null;
      if (acStart) etStarts.push(acStart);
      if (acEnd) etEnds.push(acEnd);
      actList.push({ name: acName, start: acStart, end: acEnd, tasks: tlist });
    });
    tree.push({
      name: etName,
      start: etStarts.length ? etStarts.reduce(function(a, b) { return a < b ? a : b; }) : null,
      end: etEnds.length ? etEnds.reduce(function(a, b) { return a > b ? a : b; }) : null,
      actividades: actList
    });
  });

  return { tree: tree, tasks: tasks };
}

function setStatus(msg, cls) {
  var el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status-bar' + (cls ? ' ' + cls : '');
}
function showLoading(msg) {
  document.getElementById('loadingOverlay').classList.remove('hidden');
  var m = document.getElementById('loadingMsg');
  if (m) m.innerHTML = msg || 'Cargando…';
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}
function showError(title, detail) {
  var ov = document.getElementById('loadingOverlay');
  ov.classList.remove('hidden');
  ov.innerHTML = '<div class="error-box"><h3>' + title + '</h3><p>' + detail + '</p>' +
    '<p style="margin-top:12px">Usá el botón <strong>📂 Cargar Excel</strong> de la barra superior<br>' +
    'o colocá <code>tareas.xlsx</code> junto a este HTML y serví la carpeta<br>' +
    'con un servidor local (ej. <code>python -m http.server</code>).</p></div>';
}

async function loadFromFetch() {
  setStatus('Buscando tareas.xlsx…', 'loading');
  showLoading('Leyendo <code>tareas.xlsx</code> del mismo directorio…');
  var resp = await fetch(EXCEL_FILENAME + '?t=' + Date.now());
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  
  var lastModHeader = resp.headers.get('Last-Modified');
  var lastModDate = lastModHeader ? new Date(lastModHeader) : null;
  
  var buf = await resp.arrayBuffer();
  return { buf: buf, lastModified: lastModDate };
}

function loadFromFile(file) {
  return new Promise(function(resolve, reject) {
    var reader = new FileReader();
    reader.onload = function(e) { resolve(e.target.result); };
    reader.onerror = function() { reject(new Error('No se pudo leer el archivo')); };
    reader.readAsArrayBuffer(file);
  });
}

async function ingestBuffer(buf, sourceLabel) {
  if (typeof XLSX === 'undefined') {
    throw new Error('SheetJS no cargó. Revisá la conexión a internet (CDN).');
  }
  var wb = XLSX.read(buf, { type: 'array', cellDates: true });
  var result = processWorkbook(wb);
  state.tree = result.tree;
  state.tasks = result.tasks;
  state.collapsed.clear();
  setStatus(result.tasks.length + ' tareas · ' + sourceLabel, 'ok');
  populatePersonFilter();
  render();
  hideLoading();
}

async function tryLoad() {
  try {
    var data = await loadFromFetch();
    updateLastModifiedUI(data.lastModified);
    await ingestBuffer(data.buf, EXCEL_FILENAME);
  } catch (err) {
    console.warn('fetch falló:', err);
    setStatus('No se pudo leer automáticamente', 'err');
    updateLastModifiedUI(null);
    showError(
      'No se encontró tareas.xlsx',
      'El navegador no pudo cargar <code>' + EXCEL_FILENAME + '</code> (normal si abriste el HTML con doble clic / file://).<br>' +
      'Colocá ambos archivos en la misma carpeta y abrí la página mediante un servidor local,<br>' +
      'o seleccioná el archivo manualmente con el botón de arriba.'
    );
  }
}

function computeRange(tree) {
  var minD = null, maxD = null;
  function consider(s) {
    if (!s) return;
    if (!minD || s < minD) minD = s;
    if (!maxD || s > maxD) maxD = s;
  }
  tree.forEach(function(et) {
    consider(et.start); consider(et.end);
    et.actividades.forEach(function(ac) {
      consider(ac.start); consider(ac.end);
      ac.tasks.forEach(function(t) {
        if (state.showEstimated || !t.isEstimated) {
          consider(t.start); consider(t.end);
        }
      });
    });
  });
  if (!minD) minD = state.today;
  if (!maxD) maxD = state.today;
  return { minD: addDays(minD, -1), maxD: addDays(maxD, 2) };
}

function buildDays(minD, maxD) {
  var days = [];
  var cur = minD;
  while (cur <= maxD) {
    var d = parseDate(cur);
    days.push({
      date: cur,
      day: d.getDate(),
      weekday: d.getDay(),
      month: d.getMonth(),
      year: d.getFullYear(),
      isWeekend: d.getDay() === 0 || d.getDay() === 6,
      isToday: cur === state.today
    });
    cur = addDays(cur, 1);
  }
  return days;
}

function groupMonths(days) {
  var groups = [];
  var cur = null;
  days.forEach(function(d) {
    var key = d.year + '-' + d.month;
    if (!cur || cur.key !== key) {
      cur = { key: key, year: d.year, month: d.month, days: [] };
      groups.push(cur);
    }
    cur.days.push(d);
  });
  return groups;
}

function render() {
  if (!state.tree) return;
  var tree = state.tree;
  var range = computeRange(tree);
  var minD = range.minD, maxD = range.maxD;
  var days = buildDays(minD, maxD);
  var months = groupMonths(days);
  var totalW = days.length * state.dayWidth;

  document.documentElement.style.setProperty('--day-w', state.dayWidth + 'px');

  var headerEl = document.getElementById('rightHeader');
  var hHtml = '<div class="timeline-header-inner" style="width:' + totalW + 'px">';
  months.forEach(function(m) {
    var w = m.days.length * state.dayWidth;
    hHtml += '<div class="month-group" style="width:' + w + 'px">' +
      '<div class="month-label">' + MONTH_NAMES[m.month] + ' ' + m.year + '</div><div class="days-row">';
    m.days.forEach(function(d) {
      hHtml += '<div class="day-cell' + (d.isWeekend ? ' weekend' : '') + (d.isToday ? ' today' : '') + '">' + d.day + '</div>';
    });
    hHtml += '</div></div>';
  });
  hHtml += '</div>';
  headerEl.innerHTML = hHtml;

  var leftBody = document.getElementById('leftBody');
  var timelineInner = document.getElementById('timelineInner');
  var leftHtml = '';
  var rightHtml = '<div class="grid-lines" style="width:' + totalW + 'px;height:100%;position:absolute;top:0;left:0;">';
  days.forEach(function(d) {
    rightHtml += '<div class="grid-day' + (d.isWeekend ? ' weekend' : '') + '"></div>';
  });
  rightHtml += '</div>';

  var todayIdx = -1;
  for (var ti = 0; ti < days.length; ti++) {
    if (days[ti].isToday) { todayIdx = ti; break; }
  }
  if (todayIdx >= 0) {
    rightHtml += '<div class="today-line" style="left:' + (todayIdx * state.dayWidth + state.dayWidth / 2) + 'px"></div>';
  }

  function barStyle(start, end) {
    if (!start || !end) return 'display:none';
    var left = daysBetween(minD, start) * state.dayWidth;
    var w = Math.max(daysBetween(start, end) + 1, 1) * state.dayWidth - 2;
    return 'left:' + left + 'px;width:' + w + 'px';
  }

  tree.forEach(function(et, ei) {
    var eKey = 'e' + ei;
    var eCollapsed = state.collapsed.has(eKey);

    leftHtml += '<div class="row etapa" data-key="' + eKey + '">' +
      '<span class="toggle ' + (eCollapsed ? 'collapsed' : 'expanded') + '" data-toggle="' + eKey + '"></span>' +
      '<span class="row-label">' + et.name + '</span></div>';

    var etSlug = et.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    rightHtml += '<div class="timeline-row etapa" data-key="' + eKey + '">' +
      '<div class="bar summary etapa-' + etSlug + '" style="' + barStyle(et.start, et.end) + '"></div></div>';

    if (!eCollapsed) {
      et.actividades.forEach(function(ac, ai) {
        var aKey = eKey + '-a' + ai;
        var aCollapsed = state.collapsed.has(aKey);

        leftHtml += '<div class="row actividad" data-key="' + aKey + '">' +
          '<span class="toggle ' + (aCollapsed ? 'collapsed' : 'expanded') + '" data-toggle="' + aKey + '"></span>' +
          '<span class="row-label">' + ac.name + '</span></div>';

        rightHtml += '<div class="timeline-row actividad" data-key="' + aKey + '">' +
          '<div class="bar summary act" style="' + barStyle(ac.start, ac.end) + '"></div></div>';

        if (!aCollapsed) {
          ac.tasks.forEach(function(t, tii) {
            if (!state.showEstimated && t.isEstimated) return;
            var tKey = aKey + '-t' + tii;
            var pClass = personClass(t.asignadoNorm);
            var eClass = estadoClass(t.estado);
            var dim = state.filterPerson && t.asignadoNorm !== state.filterPerson ? 'dimmed' : '';
            var estClass = t.isEstimated ? 'estimated' : '';

            leftHtml += '<div class="row tarea" data-key="' + tKey + '">' +
              '<span class="row-label" title="' + t.tarea + '">' + t.tarea + '</span>' +
              '<span class="badge ' + eClass + '">' + ((t.estado || '—').slice(0, 12)) + '</span></div>';

            var label = t.asignado ? initials(t.asignado) : '—';
            var taskJson = JSON.stringify(t).replace(/'/g, '&#39;');
            rightHtml += '<div class="timeline-row tarea" data-key="' + tKey + '">' +
              '<div class="bar ' + pClass + ' ' + eClass + ' ' + estClass + ' ' + dim + '" ' +
              'style="' + barStyle(t.start, t.end) + '" ' +
              "data-task='" + taskJson + "' " +
              'data-path="' + et.name + ' / ' + ac.name + '">' +
              '<span class="assignee">' + label + '</span></div></div>';
          });
        }
      });
    }
  });

  leftBody.innerHTML = leftHtml;
  timelineInner.innerHTML = rightHtml;
  timelineInner.style.width = totalW + 'px';
  timelineInner.style.minHeight = leftBody.scrollHeight + 'px';

  leftBody.querySelectorAll('[data-toggle]').forEach(function(el) {
    el.addEventListener('click', function(e) {
      e.stopPropagation();
      var key = el.dataset.toggle;
      if (state.collapsed.has(key)) state.collapsed.delete(key);
      else state.collapsed.add(key);
      render();
    });
  });

  timelineInner.querySelectorAll('.bar[data-task]').forEach(function(bar) {
    bar.addEventListener('mouseenter', showTooltip);
    bar.addEventListener('mousemove', moveTooltip);
    bar.addEventListener('mouseleave', hideTooltip);
  });

  syncScroll();
}

var tooltip = document.getElementById('tooltip');
function showTooltip(e) {
  var bar = e.currentTarget;
  var t;
  try { t = JSON.parse(bar.dataset.task.replace(/&#39;/g, "'")); }
  catch (ex) { return; }
  var path = bar.dataset.path;
  var html = '<div class="tt-path">' + path + '</div><strong>' + t.tarea + '</strong>';
  html += '<div class="tt-row"><span class="tt-label">Asignado</span><span>' + (t.asignado || '—') + '</span></div>';
  html += '<div class="tt-row"><span class="tt-label">Estado</span><span>' + (t.estado || '—') + '</span></div>';
  if (t.situacion) html += '<div class="tt-row"><span class="tt-label">Situación</span><span>' + t.situacion + '</span></div>';
  if (t.isEstimated) {
    html += '<div class="tt-row"><span class="tt-label">Fechas</span><span>Sin definir (estimado)</span></div>';
  } else {
    html += '<div class="tt-row"><span class="tt-label">Inicio</span><span>' + formatDate(t.start) + '</span></div>';
    html += '<div class="tt-row"><span class="tt-label">Fin</span><span>' + formatDate(t.end) + '</span></div>';
  }
  if (t.observaciones) html += '<div class="tt-obs">' + t.observaciones + '</div>';
  if (t.origen) html += '<div class="tt-obs" style="font-style:normal;color:#adb5bd">Origen: ' + t.origen + '</div>';
  tooltip.innerHTML = html;
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  var x = e.clientX + 14;
  var y = e.clientY + 14;
  var tw = tooltip.offsetWidth;
  var th = tooltip.offsetHeight;
  tooltip.style.left = (x + tw > window.innerWidth - 8 ? e.clientX - tw - 10 : x) + 'px';
  tooltip.style.top = (y + th > window.innerHeight - 8 ? e.clientY - th - 10 : y) + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

function syncScroll() {
  var left = document.getElementById('leftBody');
  var right = document.getElementById('rightBody');
  var header = document.getElementById('rightHeader');
  left.onscroll = function() { right.scrollTop = left.scrollTop; };
  right.onscroll = function() {
    left.scrollTop = right.scrollTop;
    header.scrollLeft = right.scrollLeft;
  };
}

function populatePersonFilter() {
  var sel = document.getElementById('filterPerson');
  while (sel.options.length > 1) sel.remove(1);
  var names = {};
  (state.tasks || []).forEach(function(t) {
    if (t.asignadoNorm && t.asignado) names[t.asignadoNorm] = t.asignado;
  });
  Object.keys(names).sort(function(a, b) {
    return names[a].localeCompare(names[b]);
  }).forEach(function(norm) {
    var opt = document.createElement('option');
    opt.value = norm;
    opt.textContent = names[norm];
    sel.appendChild(opt);
  });

  var leg = document.getElementById('legend');
  leg.querySelectorAll('.legend-person').forEach(function(el) { el.remove(); });
  Object.keys(names).forEach(function(norm) {
    var div = document.createElement('div');
    div.className = 'legend-item legend-person';
    div.innerHTML = '<div class="legend-swatch person ' + personClass(norm) +
      '" style="background:var(--pbg,#e9ecef);border-color:var(--p,#868e96)"></div> ' + names[norm];
    leg.appendChild(div);
  });
}

document.getElementById('filterPerson').addEventListener('change', function(e) {
  state.filterPerson = e.target.value;
  render();
});
document.getElementById('showEstimated').addEventListener('change', function(e) {
  state.showEstimated = e.target.checked;
  render();
});
document.getElementById('btnExpand').addEventListener('click', function() {
  state.collapsed.clear();
  render();
});
document.getElementById('btnCollapse').addEventListener('click', function() {
  if (!state.tree) return;
  state.tree.forEach(function(et, ei) {
    state.collapsed.add('e' + ei);
    et.actividades.forEach(function(_, ai) {
      state.collapsed.add('e' + ei + '-a' + ai);
    });
  });
  render();
});
document.getElementById('zoomIn').addEventListener('click', function() {
  state.dayWidth = Math.min(48, state.dayWidth + 6);
  render();
});
document.getElementById('zoomOut').addEventListener('click', function() {
  state.dayWidth = Math.max(14, state.dayWidth - 6);
  render();
});
document.getElementById('btnReload').addEventListener('click', function() {
  var ov = document.getElementById('loadingOverlay');
  ov.innerHTML = '<div class="spinner"></div><p id="loadingMsg">Recargando…</p>';
  ov.classList.remove('hidden');
  tryLoad();
});
document.getElementById('fileInput').addEventListener('change', async function(e) {
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  try {
    showLoading('Leyendo archivo seleccionado…');
    setStatus('Procesando…', 'loading');
    var lastMod = file.lastModified ? new Date(file.lastModified) : null;
    updateLastModifiedUI(lastMod);
    var buf = await loadFromFile(file);
    await ingestBuffer(buf, file.name);
  } catch (err) {
    console.error(err);
    setStatus('Error al leer el archivo', 'err');
    showError('Error al procesar el Excel', err.message || String(err));
  }
  e.target.value = '';
});

(function() {
  var resizer = document.getElementById('resizer');
  var leftPanel = document.getElementById('leftPanel');
  var startX, startW;
  resizer.addEventListener('mousedown', function(e) {
    startX = e.clientX;
    startW = leftPanel.offsetWidth;
    resizer.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
    function onMove(ev) {
      var w = Math.max(240, Math.min(520, startW + ev.clientX - startX));
      leftPanel.style.width = w + 'px';
      document.documentElement.style.setProperty('--left-w', w + 'px');
      resizer.style.left = w + 'px';
    }
    function onUp() {
      resizer.classList.remove('dragging');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
})();

tryLoad();
</script>
