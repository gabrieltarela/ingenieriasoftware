<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gantt de Proyecto - Desarrollo de Software</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lora:ital,wght@0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- SheetJS para lectura local de Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-principal: #f8f9fa;
            --bg-surface: #ffffff;
            --border-color: #e2e8f0;
            --border-dark: #cbd5e1;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --font-title: 'Lora', Georgia, serif;
            --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            /* Paleta de colores para Etapas */
            --stage-0: #2563eb;
            --stage-1: #0d9488;
            --stage-2: #d97706;
            --stage-3: #7c3aed;
            --stage-4: #e11d48;
            --stage-5: #4b5563;
            
            --row-height: 38px;
            --day-width: 32px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-sans);
            background-color: var(--bg-principal);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER & CONTROLES */
        header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            font-family: var(--font-title);
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        select, button, input[type="file"] {
            font-family: var(--font-sans);
            font-size: 0.85rem;
            padding: 6px 12px;
            border: 1px solid var(--border-dark);
            border-radius: 4px;
            background: var(--bg-surface);
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            transition: all 0.15s ease;
        }

        select:hover, button:hover {
            border-color: var(--text-main);
        }

        button {
            font-weight: 500;
            background: #f1f5f9;
        }

        button:active { background: #e2e8f0; }

        /* LEYENDA */
        .legend-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-color);
            padding: 8px 24px;
            display: flex;
            gap: 20px;
            font-size: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-box {
            width: 24px;
            height: 12px;
            border-radius: 2px;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .status-solid { background: #3b82f6; }
        .status-review { 
            background: repeating-linear-stripes(45deg, #f59e0b, #f59e0b 4px, #fbbf24 4px, #fbbf24 8px); 
            border: 1px solid #d97706;
        }
        .status-todo { 
            background: #f1f5f9; 
            border: 1px dashed #64748b; 
        }
        .status-estimated { 
            background: #cbd5e1; 
            border: 1px dotted #475569; 
        }

        /* WORKSPACE PRINCIPAL (LAYOUT CON SINCRO SCROLL) */
        .gantt-container {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* PANEL IZQUIERDO: ÁRBOL JERÁRQUICO */
        .tree-panel {
            width: 380px;
            min-width: 380px;
            background: var(--bg-surface);
            border-right: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            user-select: none;
            z-index: 5;
        }

        .tree-header {
            height: 50px;
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            display: flex;
            align-items: center;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            background: #f8fafc;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .tree-body {
            flex: 1;
            overflow-y: hidden; /* Controlado por JS para sincro */
        }

        .tree-row {
            height: var(--row-height);
            display: flex;
            align-items: center;
            padding-right: 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tree-row.level-0 { font-weight: 700; background: #f8fafc; color: #0f172a; }
        .tree-row.level-1 { font-weight: 600; padding-left: 20px; color: #334155; }
        .tree-row.level-2 { font-weight: 400; padding-left: 36px; color: #475569; }

        .toggle-btn {
            width: 16px;
            height: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 6px;
            cursor: pointer;
            font-size: 0.7rem;
            color: var(--text-muted);
            transition: transform 0.15s ease;
        }

        .toggle-btn.collapsed { transform: rotate(-90deg); }

        /* PANEL DERECHO: LÍNEA DE TIEMPO */
        .timeline-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg-principal);
        }

        .timeline-header-scroll {
            overflow-x: hidden;
            background: #f8fafc;
            border-bottom: 1px solid var(--border-color);
        }

        .timeline-header {
            display: flex;
            flex-direction: column;
            height: 50px;
            position: relative;
        }

        .month-row, .day-row {
            display: flex;
            position: relative;
        }

        .month-cell {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 8px;
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            background: #f1f5f9;
            color: #334155;
            text-transform: capitalize;
        }

        .day-cell {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            width: var(--day-width);
            min-width: var(--day-width);
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-right: 1px solid #f1f5f9;
            color: var(--text-muted);
        }

        .day-cell.weekend { background: #f1f5f9; color: #94a3b8; }

        .timeline-body {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        .timeline-rows-container {
            position: relative;
        }

        .timeline-row {
            height: var(--row-height);
            border-bottom: 1px solid #f1f5f9;
            position: relative;
            box-sizing: border-box;
        }

        .grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            display: flex;
            pointer-events: none;
        }

        .grid-line {
            width: var(--day-width);
            min-width: var(--day-width);
            border-right: 1px solid #f8fafc;
            height: 100%;
        }
        .grid-line.weekend { background: rgba(241, 245, 249, 0.5); }

        /* BARRAS DE GANTT */
        .gantt-bar {
            position: absolute;
            height: 22px;
            top: 8px;
            border-radius: 3px;
            font-size: 0.72rem;
            display: flex;
            align-items: center;
            padding: 0 8px;
            color: #ffffff;
            font-weight: 500;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            box-shadow: 0 1px 2px rgba(0,0,0,0.08);
            transition: opacity 0.2s ease, transform 0.1s ease;
            cursor: pointer;
            z-index: 2;
        }

        .gantt-bar:hover {
            transform: translateY(-1px);
            box-shadow: 0 3px 6px rgba(0,0,0,0.15);
            z-index: 4;
        }

        .gantt-bar.dimmed { opacity: 0.2; }

        /* Estilos por Estado */
        .gantt-bar.status-finalizada { border: 1px solid rgba(0,0,0,0.15); }
        .gantt-bar.status-en-revision {
            background-image: repeating-linear-stripes(45deg, transparent, transparent 5px, rgba(255,255,255,0.2) 5px, rgba(255,255,255,0.2) 10px) !important;
            border: 2px solid #b45309 !important;
            color: #ffffff;
            text-shadow: 0 1px 2px rgba(0,0,0,0.6);
        }
        .gantt-bar.status-sin-comenzar {
            background-color: #f8fafc !important;
            color: #334155 !important;
            border: 1.5px dashed #64748b !important;
        }

        .gantt-bar.is-estimated {
            border: 1.5px dotted #475569 !important;
            background-color: #e2e8f0 !important;
            color: #475569 !important;
        }

        /* Barras Resumen (Etapa / Actividad) */
        .summary-bar {
            position: absolute;
            height: 6px;
            top: 16px;
            border-radius: 2px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 1;
        }

        /* Línea de Hoy */
        .today-line {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #ef4444;
            z-index: 3;
            pointer-events: none;
        }
        .today-line::before {
            content: 'HOY';
            position: absolute;
            top: 2px;
            left: 4px;
            font-family: var(--font-mono);
            font-size: 0.6rem;
            background: #ef4444;
            color: white;
            padding: 1px 3px;
            border-radius: 2px;
            font-weight: bold;
        }

        /* TOOLTIP */
        .gantt-tooltip {
            position: fixed;
            background: #0f172a;
            color: #f8fafc;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 0.78rem;
            pointer-events: none;
            z-index: 100;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
            max-width: 320px;
            line-height: 1.4;
        }

        .gantt-tooltip strong { color: #38bdf8; font-family: var(--font-mono); }
        .tooltip-path { font-size: 0.7rem; color: #94a3b8; margin-bottom: 4px; }
        .tooltip-row { margin-top: 4px; display: flex; justify-content: space-between; gap: 10px; }

        /* MENSAJE DE CARGA DE ARCHIVO */
        .file-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            gap: 16px;
        }
        .file-box {
            border: 2px dashed var(--border-dark);
            padding: 40px;
            border-radius: 8px;
            text-align: center;
            background: white;
        }
    </style>
</head>
<body>

    <header>
        <h1>Cronograma de Desarrollo de Software</h1>
        <div class="controls">
            <div class="control-group">
                <label>Asignado:</label>
                <select id="assigneeFilter">
                    <option value="ALL">Todos</option>
                </select>
            </div>
            <div class="control-group">
                <label>Zoom:</label>
                <select id="zoomSelect">
                    <option value="24">Compacto</option>
                    <option value="32" selected>Normal</option>
                    <option value="48">Amplio</option>
                </select>
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="toggleEstimated" checked>
                    Mostrar sin fecha (estimados)
                </label>
            </div>
            <button id="btnExpandAll">Expandir Todo</button>
            <button id="btnCollapseAll">Colapsar Todo</button>
        </div>
    </header>

    <div class="legend-bar">
        <div class="legend-item"><div class="legend-box status-solid"></div> Finalizada</div>
        <div class="legend-item"><div class="legend-box status-review"></div> En Revisión</div>
        <div class="legend-item"><div class="legend-box status-todo"></div> Sin Comenzar</div>
        <div class="legend-item"><div class="legend-box status-estimated"></div> Sin Fecha (Estimado final)</div>
    </div>

    <div class="gantt-container">
        <!-- Overlay para seleccionar archivo si no detecta tareas precargadas -->
        <div id="fileOverlay" class="file-overlay">
            <div class="file-box">
                <h2 style="font-family: var(--font-title); margin-bottom: 8px;">Cargar tareas.xlsx</h2>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">
                    Selecciona el archivo <code>tareas.xlsx</code> que está en tu directorio.
                </p>
                <input type="file" id="excelFileInput" accept=".xlsx, .xls" />
            </div>
        </div>

        <!-- Panel Izquierdo -->
        <div class="tree-panel">
            <div class="tree-header">Estructura WBS / Tareas</div>
            <div class="tree-body" id="treeBody"></div>
        </div>

        <!-- Panel Derecho -->
        <div class="timeline-panel">
            <div class="timeline-header-scroll" id="headerScroll">
                <div class="timeline-header" id="timelineHeader"></div>
            </div>
            <div class="timeline-body" id="timelineBody">
                <div class="timeline-rows-container" id="timelineRows"></div>
            </div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="ganttTooltip" class="gantt-tooltip"></div>

    <script>
        // --- ESTADO GLOBAL Y CONFIGURACIÓN ---
        let rawTasks = [];
        let processedHierarchy = [];
        let flatRenderList = [];
        let assignees = new Set();
        let stageColors = {};
        
        let dayWidth = 32;
        let selectedAssignee = 'ALL';
        let showEstimated = true;
        let collapsedNodes = new Set();

        let projectMinDate = null;
        let projectMaxDate = null;
        let timelineStartDate = null;
        let totalDays = 0;

        const PALETTE = ['#2563eb', '#0d9488', '#d97706', '#7c3aed', '#e11d48', '#4b5563', '#0284c7', '#059669'];

        // --- INICIALIZACIÓN Y EVENTOS ---
        document.addEventListener('DOMContentLoaded', () => {
            // Intenta cargar automáticamente tareas.xlsx desde el mismo servidor local si existe
            fetch('tareas.xlsx')
                .then(res => {
                    if (!res.ok) throw new Error("No encontrado directamente");
                    return res.arrayBuffer();
                })
                .then(buffer => processExcelBuffer(buffer))
                .catch(() => {
                    // Si falla por CORS o apertura directa file://, muestra el selector
                    document.getElementById('fileOverlay').style.display = 'flex';
                });

            document.getElementById('excelFileInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => processExcelBuffer(evt.target.result);
                reader.readAsArrayBuffer(file);
            });

            // Sincronización de Scroll
            const treeBody = document.getElementById('treeBody');
            const timelineBody = document.getElementById('timelineBody');
            const headerScroll = document.getElementById('headerScroll');

            timelineBody.addEventListener('scroll', () => {
                treeBody.scrollTop = timelineBody.scrollTop;
                headerScroll.scrollLeft = timelineBody.scrollLeft;
            });

            // Controles
            document.getElementById('zoomSelect').addEventListener('change', (e) => {
                dayWidth = parseInt(e.target.value);
                document.documentElement.style.setProperty('--day-width', `${dayWidth}px`);
                renderGantt();
            });

            document.getElementById('assigneeFilter').addEventListener('change', (e) => {
                selectedAssignee = e.target.value;
                applyFilters();
            });

            document.getElementById('toggleEstimated').addEventListener('change', (e) => {
                showEstimated = e.target.checked;
                rebuildRenderList();
                renderGantt();
            });

            document.getElementById('btnExpandAll').addEventListener('click', () => {
                collapsedNodes.clear();
                rebuildRenderList();
                renderGantt();
            });

            document.getElementById('btnCollapseAll').addEventListener('click', () => {
                processedHierarchy.forEach(stage => {
                    collapsedNodes.add(stage.id);
                    stage.activities.forEach(act => collapsedNodes.add(act.id));
                });
                rebuildRenderList();
                renderGantt();
            });
        });

        // --- NORMALIZACIÓN Y LECTURA DE DATOS ---
        function normalizeName(name) {
            if (!name) return 'Sin Asignar';
            return name.toString().trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        }

        function parseExcelDate(excelValue) {
            if (!excelValue) return null;
            if (excelValue instanceof Date) return excelValue;
            if (typeof excelValue === 'number') {
                return new Date(Math.round((excelValue - 25569) * 86400 * 1000));
            }
            const parsed = new Date(excelValue);
            return isNaN(parsed.getTime()) ? null : parsed;
        }

        function processExcelBuffer(buffer) {
            const workbook = XLSX.read(buffer, { type: 'array', cellDates: true });
            const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: "" });

            document.getElementById('fileOverlay').style.display = 'none';

            let currentStage = "Sin Etapa";
            const tasks = [];
            assignees.clear();

            jsonData.forEach((row, idx) => {
                const taskName = row['Tarea'] || row['TAREA'];
                if (!taskName || taskName.toString().trim() === "") return; // Ignorar si TAREA está vacío

                let stage = row['Etapa'] || row['ETAPA'];
                if (stage && stage.toString().trim() !== "") {
                    currentStage = stage.toString().trim();
                } // Forward-fill heredado si está vacío

                const activity = (row['Actividad'] || row['ACTIVIDAD'] || 'General').toString().trim();
                const status = (row['Estado'] || row['ESTADO'] || 'Sin Comenzar').toString().trim();
                const situation = (row['Situacion'] || row['SITUACION'] || '').toString().trim();
                const rawAssignee = (row['Asignado'] || row['ASIGNADO'] || 'Sin Asignar').toString().trim();
                
                const prettyAssignee = rawAssignee;
                const normalizedAssigneeKey = normalizeName(rawAssignee).toLowerCase();
                assignees.add(prettyAssignee);

                const startDate = parseExcelDate(row['Fecha Asignada'] || row['FECHA ASIGNADA']);
                let endDate = parseExcelDate(row['Fecha Entrega'] || row['FECHA ENTREGA']);
                if (!endDate) endDate = parseExcelDate(row['Fecha Vencim'] || row['FECHA VENCIM']);
                if (!endDate) endDate = startDate;

                const hasDate = !!(startDate);

                tasks.push({
                    id: `task-${idx}`,
                    stage: currentStage,
                    activity: activity,
                    title: taskName.toString().trim(),
                    status: status,
                    situation: situation,
                    assignee: prettyAssignee,
                    assigneeKey: normalizedAssigneeKey,
                    start: startDate,
                    end: endDate,
                    hasDate: hasDate,
                    observations: row['Observaciones'] || row['OBSERVACIONES'] || '',
                    origin: row['Origen'] || row['ORIGEN'] || ''
                });
            });

            buildHierarchy(tasks);
        }

        // --- CONSTRUCCIÓN DE JERARQUÍA Y TIEMPOS ---
        function buildHierarchy(tasks) {
            let maxRealDate = new Date();
            let minRealDate = new Date();
            let firstDateFound = false;

            // Encontrar rango real
            tasks.forEach(t => {
                if (t.hasDate) {
                    if (!firstDateFound || t.start < minRealDate) minRealDate = new Date(t.start);
                    if (!firstDateFound || t.end > maxRealDate) maxRealDate = new Date(t.end);
                    firstDateFound = true;
                }
            });

            if (!firstDateFound) {
                minRealDate = new Date();
                maxRealDate = new Date();
            }

            // Asignar fechas secuenciales para las "sin fecha real" al final de la línea de tiempo
            let estCursor = new Date(maxRealDate);
            estCursor.setDate(estCursor.getDate() + 2); // margen inicial de 2 días

            tasks.forEach(t => {
                if (!t.hasDate) {
                    t.start = new Date(estCursor);
                    t.end = new Date(estCursor);
                    t.end.setDate(t.end.getDate() + 1); // dura 1 día estimado
                    estCursor.setDate(estCursor.getDate() + 2); // avance secuencial
                }
            });

            projectMinDate = new Date(minRealDate);
            projectMinDate.setDate(projectMinDate.getDate() - 3); // Margen izq
            projectMaxDate = new Date(estCursor);
            projectMaxDate.setDate(projectMaxDate.getDate() + 5); // Margen der

            // Agrupar Etapa -> Actividad -> Tarea
            const stagesMap = {};
            let stageIdx = 0;

            tasks.forEach(t => {
                if (!stagesMap[t.stage]) {
                    stagesMap[t.stage] = {
                        id: `stage-${stageIdx++}`,
                        title: t.stage,
                        color: PALETTE[stageIdx % PALETTE.length],
                        activitiesMap: {},
                        minDate: t.start,
                        maxDate: t.end
                    };
                }

                const st = stagesMap[t.stage];
                if (t.start < st.minDate) st.minDate = t.start;
                if (t.end > st.maxDate) st.maxDate = t.end;

                if (!st.activitiesMap[t.activity]) {
                    st.activitiesMap[t.activity] = {
                        id: `${st.id}-act-${Object.keys(st.activitiesMap).length}`,
                        title: t.activity,
                        stageTitle: t.stage,
                        color: st.color,
                        tasks: [],
                        minDate: t.start,
                        maxDate: t.end
                    };
                }

                const act = st.activitiesMap[t.activity];
                if (t.start < act.minDate) act.minDate = t.start;
                if (t.end > act.maxDate) act.maxDate = t.end;

                act.tasks.push(t);
            });

            // Convertir a estructura jerárquica
            processedHierarchy = Object.values(stagesMap).map(st => ({
                id: st.id,
                title: st.title,
                type: 'stage',
                color: st.color,
                minDate: st.minDate,
                maxDate: st.maxDate,
                activities: Object.values(st.activitiesMap).map(act => ({
                    id: act.id,
                    title: act.title,
                    stageTitle: act.stageTitle,
                    type: 'activity',
                    color: act.color,
                    minDate: act.minDate,
                    maxDate: act.maxDate,
                    tasks: act.tasks
                }))
            }));

            // Llenar selector de Asignados
            const select = document.getElementById('assigneeFilter');
            select.innerHTML = '<option value="ALL">Todos</option>';
            Array.from(assignees).sort().forEach(person => {
                const opt = document.createElement('option');
                opt.value = normalizeName(person).toLowerCase();
                opt.textContent = person;
                select.appendChild(opt);
            });

            rebuildRenderList();
            renderGantt();
        }

        // --- CONSTRUCCIÓN DE LISTA PLANA RENDERIZABLE ---
        function rebuildRenderList() {
            flatRenderList = [];

            processedHierarchy.forEach(stage => {
                flatRenderList.push({ ...stage, level: 0 });

                if (!collapsedNodes.has(stage.id)) {
                    stage.activities.forEach(act => {
                        flatRenderList.push({ ...act, level: 1 });

                        if (!collapsedNodes.has(act.id)) {
                            act.tasks.forEach(task => {
                                if (!showEstimated && !task.hasDate) return;
                                flatRenderList.push({ ...task, level: 2, color: stage.color });
                            });
                        }
                    });
                }
            });
        }

        // --- RENDERIZADO DEL DIAGRAMA DE GANTT ---
        function renderGantt() {
            renderHeader();
            renderTreeAndTimeline();
        }

        function renderHeader() {
            const headerContainer = document.getElementById('timelineHeader');
            headerContainer.innerHTML = '';

            const monthRow = document.createElement('div');
            monthRow.className = 'month-row';
            const dayRow = document.createElement('div');
            dayRow.className = 'day-row';

            timelineStartDate = new Date(projectMinDate);
            timelineStartDate.setHours(0,0,0,0);

            const curr = new Date(timelineStartDate);
            let totalD = 0;
            let currentMonth = null;
            let currentMonthWidth = 0;
            let monthCell = null;

            while (curr <= projectMaxDate) {
                totalD++;
                const mName = curr.toLocaleString('es-ES', { month: 'long', year: 'numeric' });

                if (mName !== currentMonth) {
                    if (monthCell) {
                        monthCell.style.width = `${currentMonthWidth * dayWidth}px`;
                    }
                    currentMonth = mName;
                    currentMonthWidth = 0;
                    monthCell = document.createElement('div');
                    monthCell.className = 'month-cell';
                    monthCell.textContent = mName;
                    monthRow.appendChild(monthCell);
                }
                currentMonthWidth++;

                const dayCell = document.createElement('div');
                const isWeekend = curr.getDay() === 0 || curr.getDay() === 6;
                dayCell.className = `day-cell ${isWeekend ? 'weekend' : ''}`;
                dayCell.textContent = curr.getDate();
                dayRow.appendChild(dayCell);

                curr.setDate(curr.getDate() + 1);
            }

            if (monthCell) {
                monthCell.style.width = `${currentMonthWidth * dayWidth}px`;
            }

            totalDays = totalD;
            headerContainer.appendChild(monthRow);
            headerContainer.appendChild(dayRow);

            const fullWidth = totalDays * dayWidth;
            headerContainer.style.width = `${fullWidth}px`;
            document.getElementById('timelineRows').style.width = `${fullWidth}px`;
        }

        function renderTreeAndTimeline() {
            const treeBody = document.getElementById('treeBody');
            const timelineRows = document.getElementById('timelineRows');

            treeBody.innerHTML = '';
            timelineRows.innerHTML = '';

            // Dibujar Fondo Grilla y Línea de Hoy
            const gridLines = document.createElement('div');
            gridLines.className = 'grid-lines';
            const curr = new Date(timelineStartDate);
            
            const today = new Date();
            today.setHours(0,0,0,0);
            let todayOffset = -1;

            for (let i = 0; i < totalDays; i++) {
                const line = document.createElement('div');
                const isWeekend = curr.getDay() === 0 || curr.getDay() === 6;
                line.className = `grid-line ${isWeekend ? 'weekend' : ''}`;
                gridLines.appendChild(line);

                if (curr.getTime() === today.getTime()) {
                    todayOffset = i;
                }
                curr.setDate(curr.getDate() + 1);
            }
            timelineRows.appendChild(gridLines);

            if (todayOffset >= 0) {
                const todayLine = document.createElement('div');
                todayLine.className = 'today-line';
                todayLine.style.left = `${todayOffset * dayWidth}px`;
                timelineRows.appendChild(todayLine);
            }

            // Dibujar Filas de Árbol y Tareas
            flatRenderList.forEach((item) => {
                // 1. Árbol Izquierdo
                const treeRow = document.createElement('div');
                treeRow.className = `tree-row level-${item.level}`;

                let toggleHtml = '';
                if (item.level < 2) {
                    const isCollapsed = collapsedNodes.has(item.id);
                    toggleHtml = `<span class="toggle-btn ${isCollapsed ? 'collapsed' : ''}" onclick="toggleNode('${item.id}')">▼</span>`;
                } else {
                    toggleHtml = `<span style="width:16px; display:inline-block;"></span>`;
                }

                treeRow.innerHTML = `${toggleHtml}<span title="${item.title}">${item.title}</span>`;
                treeBody.appendChild(treeRow);

                // 2. Fila Timeline Derecha
                const tRow = document.createElement('div');
                tRow.className = 'timeline-row';

                if (item.level === 2) {
                    // Tarea individual
                    const startDiff = getDaysDiff(timelineStartDate, item.start);
                    const duration = Math.max(1, getDaysDiff(item.start, item.end) + 1);

                    const bar = document.createElement('div');
                    const statusClass = `status-${item.status.toLowerCase().replace(/\s+/g, '-')}`;
                    bar.className = `gantt-bar ${statusClass} ${!item.hasDate ? 'is-estimated' : ''}`;
                    
                    bar.style.left = `${startDiff * dayWidth}px`;
                    bar.style.width = `${duration * dayWidth - 4}px`;
                    bar.style.backgroundColor = item.color;

                    // Requisito: Nombre o Iniciales dentro
                    bar.textContent = item.assignee ? getInitialsOrName(item.assignee) : 'S/A';

                    // Resaltado/Atenuado por asignado
                    if (selectedAssignee !== 'ALL' && item.assigneeKey !== selectedAssignee) {
                        bar.classList.add('dimmed');
                    }

                    // Tooltip
                    bar.addEventListener('mouseenter', (e) => showTooltip(e, item));
                    bar.addEventListener('mousemove', (e) => moveTooltip(e));
                    bar.addEventListener('mouseleave', hideTooltip);

                    tRow.appendChild(bar);

                } else {
                    // Barra Resumen (Etapa o Actividad)
                    const startDiff = getDaysDiff(timelineStartDate, item.minDate);
                    const duration = Math.max(1, getDaysDiff(item.minDate, item.maxDate) + 1);

                    const summaryBar = document.createElement('div');
                    summaryBar.className = 'summary-bar';
                    summaryBar.style.left = `${startDiff * dayWidth}px`;
                    summaryBar.style.width = `${duration * dayWidth}px`;
                    summaryBar.style.backgroundColor = item.color;

                    tRow.appendChild(summaryBar);
                }

                timelineRows.appendChild(tRow);
            });
        }

        // --- HELPERS Y EVENTOS DE INTERACCIÓN ---
        function toggleNode(nodeId) {
            if (collapsedNodes.has(nodeId)) {
                collapsedNodes.delete(nodeId);
            } else {
                collapsedNodes.add(nodeId);
            }
            rebuildRenderList();
            renderGantt();
        }

        function getDaysDiff(d1, d2) {
            const t1 = new Date(d1).setHours(0,0,0,0);
            const t2 = new Date(d2).setHours(0,0,0,0);
            return Math.round((t2 - t1) / (1000 * 60 * 60 * 24));
        }

        function getInitialsOrName(name) {
            if (!name) return 'S/A';
            const parts = name.trim().split(' ');
            if (parts.length === 1) return parts[0];
            return parts.map(p => p[0]).join('').toUpperCase();
        }

        function applyFilters() {
            renderGantt();
        }

        // --- TOOLTIP INTERACTIVO ---
        const tooltip = document.getElementById('ganttTooltip');

        function showTooltip(e, task) {
            const dateStr = task.hasDate 
                ? `${formatDate(task.start)} al ${formatDate(task.end)}`
                : 'Sin fecha definida (Ubicación estimada)';

            tooltip.innerHTML = `
                <div class="tooltip-path">${task.stage} &rsaquo; ${task.activity}</div>
                <strong>${task.title}</strong>
                <div class="tooltip-row"><span>Asignado:</span> <b>${task.assignee}</b></div>
                <div class="tooltip-row"><span>Estado:</span> <b>${task.status}</b></div>
                ${task.situation ? `<div class="tooltip-row"><span>Situación:</span> <b>${task.situation}</b></div>` : ''}
                <div class="tooltip-row"><span>Fechas:</span> <b>${dateStr}</b></div>
                ${task.observations ? `<div style="margin-top:6px; border-top:1px solid #334155; padding-top:4px; font-style:italic; color:#cbd5e1;">Obs: ${task.observations}</div>` : ''}
                ${task.origin ? `<div style="font-size:0.68rem; color:#94a3b8;">Origen: ${task.origin}</div>` : ''}
            `;
            tooltip.style.display = 'block';
            moveTooltip(e);
        }

        function moveTooltip(e) {
            tooltip.style.left = `${e.clientX + 15}px`;
            tooltip.style.top = `${e.clientY + 15}px`;
        }

        function hideTooltip() {
            tooltip.style.display = 'none';
        }

        function formatDate(d) {
            if (!d) return '-';
            return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
        }
    </script>
</body>
